name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: research-idea demo --project research-projects/ci-demo
      - run: research-idea resume --project research-projects/ci-demo
  windows-cli:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_cli_workspace tests.test_backends tests.test_problem_dialogue tests.test_question_dialogue tests.test_research_reasoning -v
