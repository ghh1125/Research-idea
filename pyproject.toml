[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-idea"
version = "0.6.0"
description = "Evidence-driven LLM/NLP research ideation with interchangeable execution backends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["prompt-toolkit>=3.0.43,<4"]

[project.scripts]
research-idea = "research_idea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["research_idea*"]

[tool.setuptools.package-data]
research_idea = ["builtin_skills/*/SKILL.md", "builtin_skills/*/references/*.md", "builtin_skills/*/agents/openai.yaml"]
