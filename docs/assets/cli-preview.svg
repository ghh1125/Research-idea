<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1200" viewBox="0 0 1120 1200" role="img" aria-labelledby="title desc">
<title id="title">Research-idea CLI 界面示意</title>
<desc id="desc">上方是包含 IDEA 图标、使用说明和输入框的欢迎页。下方是运行状态：彩色步骤输出、旋转指示、当前模型和累计预算，运行时隐藏输入框。正文与用量为示意。</desc>
<rect width="1120" height="1200" fill="#f1f5f9"/>
<style>
text { font-family: 'SFMono-Regular', Menlo, Consolas, 'PingFang SC', 'Microsoft YaHei', monospace; font-size: 16px; fill: #dbe4f0; }
.caption { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 20px; font-weight: 650; fill: #1e293b; }
.muted { fill: #94a3b8; } .green { fill: #74e3a4; } .cyan { fill: #6ddde6; } .purple { fill: #c4a1ff; } .yellow { fill: #f3d281; } .blue { fill: #8fbaff; }
</style>
<text x="26" y="33" class="caption" xml:space="preserve">等待输入 · 先讨论方向，再用 /run 开始研究</text>
