<text x="52" y="117" class="green" xml:space="preserve" style="font-size:18px">             R E S E A R C H</text>
<text x="52" y="139" class="green" xml:space="preserve" style="font-size:18px"></text>
<text x="52" y="161" class="green" xml:space="preserve" style="font-size:18px">       ___ ____  _____    _</text>
<text x="52" y="183" class="green" xml:space="preserve" style="font-size:18px">      |_ _|  _ \| ____|  / \</text>
<text x="52" y="205" class="green" xml:space="preserve" style="font-size:18px">       | || | | |  _|   / _ \</text>
<text x="52" y="227" class="green" xml:space="preserve" style="font-size:18px">       | || |_| | |___ / ___ \</text>
<text x="52" y="249" class="green" xml:space="preserve" style="font-size:18px">      |___|____/|_____/_/   \_\</text>
<text x="52" y="271" class="green" xml:space="preserve" style="font-size:18px"></text>
<text x="52" y="293" class="green" xml:space="preserve" style="font-size:18px">       IDEAS ONLY</text>
<text x="52" y="315" class="green" xml:space="preserve" style="font-size:18px">       From papers to research proposals</text>
<text x="52" y="358" class="" xml:space="preserve" style="font-size:16px">从一个研究方向，到一份可以开始验证的 idea。</text>
<text x="52" y="382" class="" xml:space="preserve" style="font-size:16px"></text>
<text x="52" y="406" class="" xml:space="preserve" style="font-size:16px">1. 输入方向和补充想法，直接与模型讨论。</text>
<text x="52" y="430" class="" xml:space="preserve" style="font-size:16px">2. 输入 /run：第一阶段 背景 → 问题 → 动机 → Idea；第二阶段 Idea → Method。</text>
<text x="52" y="454" class="" xml:space="preserve" style="font-size:16px">3. 最后得到核心想法、研究价值、与已有工作的差异，以及技术参考。</text>
<text x="52" y="478" class="" xml:space="preserve" style="font-size:16px"></text>
<text x="52" y="502" class="cyan" xml:space="preserve" style="font-size:16px">/model 选择模型 · /reasoning 思考强度 · /date 时间 · /budget 预算</text>
<text x="52" y="526" class="cyan" xml:space="preserve" style="font-size:16px">/intro 使用介绍 · /new 新研究 · /help 全部命令</text>
<text x="52" y="573" class="" xml:space="preserve" style="font-size:18px">› /model</text>
