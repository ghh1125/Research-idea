  @media(max-width:600px){#ri-web-preview .ri-previewbar{padding-right:0}#ri-web-preview .ri-window{grid-template-columns:1fr;min-height:0}#ri-web-preview .ri-sidebar{border-right:0;border-bottom:1px solid var(--ri-line);padding:12px;display:grid;grid-template-columns:1fr auto;gap:8px}#ri-web-preview .ri-brand{margin:0}#ri-web-preview .ri-sidebar>.ri-button{width:auto}#ri-web-preview .ri-sidebarlabel,#ri-web-preview #ri-projects,#ri-web-preview .ri-sidebottom .ri-local{display:none}#ri-web-preview .ri-sidebottom{padding:0;display:flex;margin:0;justify-content:flex-end}#ri-web-preview .ri-navbutton{font-size:11px;padding:7px}#ri-web-preview .ri-header{padding:17px 16px}#ri-web-preview .ri-header h2{font-size:17px}#ri-web-preview .ri-header>.ri-button{font-size:11px}#ri-web-preview .ri-tabs{padding:0 16px;gap:14px}#ri-web-preview .ri-tab{font-size:11px}#ri-web-preview .ri-tab-extra{font-size:11px}#ri-web-preview #ri-content{padding:20px 16px}#ri-web-preview .ri-formgrid{grid-template-columns:1fr}#ri-web-preview .ri-venues{grid-template-columns:repeat(2,minmax(0,1fr))}#ri-web-preview .ri-intro{flex-wrap:wrap}#ri-web-preview .ri-steps{justify-content:flex-start;row-gap:8px;font-size:11px}#ri-web-preview .ri-stepsep{flex:0;width:6px}#ri-web-preview .ri-welcome{padding:20px 0}#ri-web-preview .ri-welcome h3{font-size:27px}#ri-web-preview .ri-next{align-items:stretch}#ri-web-preview .ri-next>.ri-button{width:100%}#ri-web-preview .ri-helpmap{grid-template-columns:95px 1fr}#ri-web-preview .ri-footer{padding:12px 16px;font-size:11px}#ri-web-preview .ri-previewbar>span .ri-muted{display:block}#ri-web-preview .ri-field input,#ri-web-preview .ri-field select,#ri-web-preview .ri-field textarea,#ri-web-preview .ri-composer textarea{font-size:16px}}
  @media(pointer:coarse){#ri-web-preview button,#ri-web-preview select{min-height:44px}}
  #ri-web-preview .ri-window{min-height:650px}
  #ri-web-preview .ri-overline{display:none}
  #ri-web-preview .ri-steps{display:none}
  #ri-web-preview .ri-materials{margin-left:auto;padding:10px 0}
  #ri-web-preview .ri-materials[open]{flex-basis:100%;margin:0}
  #ri-web-preview .ri-materials .ri-row{margin:10px 0}
  #ri-web-preview .ri-advanced{margin-top:24px}
  #ri-web-preview .ri-welcome{padding:65px 0 45px}
  #ri-web-preview .ri-welcomehint{margin-top:32px!important;font-size:12px!important}
  #ri-web-preview .ri-conversation{font-size:14px;line-height:1.85;max-width:680px;margin:auto}
  #ri-web-preview .ri-conversation p{margin:14px 0}
  #ri-web-preview .ri-conversation h4{margin-top:20px;font-size:15px;font-weight:600}
  #ri-web-preview .ri-speaker{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ri-accent);margin-bottom:18px}
  #ri-web-preview .ri-speaker span{margin-left:auto;font-weight:400;color:var(--ri-muted)}
  #ri-web-preview .ri-next{margin:24px 0 12px}
  #ri-web-preview .ri-composer textarea{font-size:14px}
  @media(max-width:600px){#ri-web-preview .ri-welcome{padding:24px 0}#ri-web-preview .ri-window{min-height:0}#ri-web-preview .ri-conversation{font-size:14px}}
</style>
<script>
(() => {
  const root = document.getElementById('ri-web-preview');
  const h = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const btn = (action, label, primary=false) => `<button type="button" class="ri-button ${primary?'ri-primary':''} cursor-interaction" data-action="${action}">${label}</button>`;
  const projects = ['个人助理的持续学习','压缩文本如何保留含义','Agent 如何持续自我改进'];
  const venues = ['NeurIPS','ICML','ICLR','ACL','EMNLP','NAACL','COLM','AAAI','IJCAI','AAMAS','KDD','ICDM','ICDE','SIGMOD','VLDB','ACM MM','CVPR','ICCV','SIGIR','WWW'];
  const state = {page:'discussion',phase:'new',project:0,settings:'model',memory:'notes',paper:null,draft:'',topic:'',messages:[],scope:'research',files:[],customSkills:[],model:'gpt-6.1-sol',effort:'high',backend:'codex',calls:80,minutes:110,papers:6,fields:{},chosenVenues:new Set(venues),search:'',sort:'relevance'};
  const papers = [
    {title:'Aligning LLM Agents by Learning Latent Preference from User Edits',short:'PRELUDE / CIPHER',venue:'NeurIPS 2024',year:2024,status:'已阅读全文',kind:'学习用户偏好',url:'https://arxiv.org/abs/2404.15269',impact:'用户的编辑可以转化成偏好，帮助减少后续修改。它是当前问题必须认真比较的已有回应。'},
    {title:'Context Steering: Controllable Personalization at Inference Time',short:'Context Steering',venue:'arXiv · cs',year:2024,status:'已阅读全文',kind:'应用已知偏好',url:'https://arxiv.org/abs/2405.01768',impact:'给定用户偏好，已有方法可以影响新请求的回答。跨请求使用偏好本身不能直接当作新的问题。'},
    {title:'待补充的最接近工作',short:'主动偏好获取',venue:'检索计划',year:2026,status:'待检索',kind:'当前阅读问题',url:'',impact:'重点查清：主动询问取得哪些信息，是否仍要求用户重新检查已经委托的内容。'}
  ];
  const notes = ['利用过去交流减少用户反复交代，同时理解不同情境下的选择。','不预设困难一定来自记忆过时；先看现有方法已经解决什么。','只形成背景、现有方法、问题、动机与研究主张。'];
  const saved = window.openai?.widgetState?.privateContent;
  if(saved && saved.design===2 && ['discussion','papers','report','memory','settings','help'].includes(saved.page)){state.page=saved.page;if(['new','running','direction','problem','done','error','stopped'].includes(saved.phase))state.phase=saved.phase;}
  const persist = () => {window.openai?.setWidgetState?.({modelContent:{preview:'Research-idea 0.8.0',page:state.page,phase:state.phase},privateContent:{design:2,page:state.page,phase:state.phase}})?.catch(()=>{});};
  const notify = text => {root.querySelector('#ri-notice').textContent=text;};
  const field = (name,label,value,type='text',hint='') => `<label class="ri-field"><span>${label}</span><input name="${name}" type="${type}" value="${h(state.fields[name]??value)}" ${type==='number'?'min="1" step="1"':''}>${hint?`<small>${hint}</small>`:''}</label>`;
  const select = (name,label,options,value,hint='') => `<label class="ri-field"><span>${label}</span><select name="${name}">${options.map(x=>{const [v,l]=Array.isArray(x)?x:[x,x];return `<option value="${h(v)}" ${String(state.fields[name]??value)===String(v)?'selected':''}>${h(l)}</option>`}).join('')}</select>${hint?`<small>${hint}</small>`:''}</label>`;
  const check = (name,label,yes=true) => `<label class="ri-check"><input type="checkbox" name="${name}" ${(state.fields[name]??yes)?'checked':''}>${label}</label>`;
  const steps = () => {const current={new:0,running:2,direction:1,problem:3,done:4,error:2,stopped:2}[state.phase];return `<div class="ri-steps" aria-label="研究进度">${['调研方向','讨论方向','深入比较','讨论问题','研究主张'].map((x,i)=>`${i?'<span class="ri-stepsep"></span>':''}<span class="ri-step ${i===current?'current':''}" ${i===current?'aria-current="step"':''}><span class="ri-stepnum">${i<current?'✓':i+1}</span>${x}</span>`).join('')}</div>`};
  function composer(){return `<div class="ri-composer"><textarea id="ri-draft" aria-label="给研究助手的意见" placeholder="直接说哪里不合理，或让它把一个地方讲清楚…">${h(state.draft)}</textarea><div class="ri-row ri-between"><div class="ri-row"><button class="ri-button ri-quiet cursor-interaction" data-action="input-file">${icon('paperclip')} 添加文字材料</button><span class="ri-tiny ri-muted">可以反复讨论</span></div>${btn('send','发送 '+icon('arrow-up'),true)}</div></div>`;}
  function welcome(){return `<div class="ri-welcome"><div class="ri-eyebrow">A good question is a good beginning</div><h3>你想研究什么？<br>先从一个想法开始。</h3><p>梳理文献，一起找到重要的问题，再把研究动机想清楚。</p><div class="ri-composer"><textarea id="ri-topic" aria-label="研究方向" placeholder="用自己的话说就好。你关心什么现象，觉得哪里还不够好？">${h(state.topic)}</textarea><div class="ri-row ri-between">${btn('topic-file',icon('paperclip')+' 导入文字')}${btn('start','开始调研 '+icon('arrow-right'),true)}</div></div><div class="ri-presets">${['长期个人助理','多智能体协作','有限数据的利用'].map(x=>`<button class="cursor-interaction" data-example="${x}">${x} ${icon('arrow-up-right')}</button>`).join('')}</div><div class="ri-row ri-between"><span class="ri-small ri-muted">${h(state.model)} · ${h(state.effort)} · 近期会议与 arXiv</span><button class="ri-textbutton cursor-interaction" data-action="settings">调整设置</button></div><details style="margin-top:18px"><summary class="cursor-interaction">补充论文、资源条件，或先保存草稿</summary><div class="ri-stack">${btn('import-papers',icon('files')+' 添加参考论文')}<label class="ri-field"><span>资源与范围（选填）</span><textarea name="constraints" placeholder="例如：关注 LLM / NLP，有一张 24GB GPU…">${h(state.fields.constraints||'')}</textarea></label>${btn('save-draft','先保存，暂不运行')}</div></details><div class="ri-note"><strong>最后得到什么？</strong><p>背景 → 现有方法 → 重要问题 → 动机 → 研究主张。<br>调研和比较后会停下来，留出讨论、追问与纠正的空间。</p></div></div>`;}
  function discussion(){if(state.phase==='new')return welcome();if(['running','error','stopped'].includes(state.phase))return running();return `${steps()}<div class="ri-intro"><div><div class="ri-eyebrow">${state.phase==='direction'?'Explore together':'Think it through'}</div><h3>${state.phase==='done'?'继续打磨这个研究问题':state.phase==='direction'?'先确定值得深入的方向':'这两个问题，哪个更值得追问？'}</h3><p>你可以质疑原因、补充观察，或让助手继续查文献。</p></div><span class="ri-pill">${icon('message-circle')} ${state.phase==='done'?'可继续讨论':'等你讨论'}</span></div><div class="ri-background"><div class="ri-tiny ri-muted">背景与现有方法</div><p>我们希望个人助理越用越省心。已有方法能记住历史、学习偏好，也能主动询问；但日常交流如何持续帮助它理解用户，还值得深入。</p><details><summary class="cursor-interaction">展开已有进展与论文依据</summary><p>记忆检索帮助复用历史；偏好学习从修改中提取规律；主动澄清补充缺少的信息。我们从这些方法有效之后的状态出发比较问题。</p><button class="ri-textbutton cursor-interaction" data-paper="0">PRELUDE / CIPHER ↗</button> · <button class="ri-textbutton cursor-interaction" data-paper="1">Context Steering ↗</button></details></div><div class="ri-row ri-between"><span class="ri-small">当前的两个研究问题</span><button class="ri-textbutton ri-tiny cursor-interaction" data-action="replan">用现有材料重新构思</button></div><div class="ri-candidates"><article class="ri-candidate suggested"><div class="ri-row ri-between"><span class="ri-tiny ri-muted">问题 A</span><span class="ri-pill">助手当前建议</span></div><h4>用户少检查后，助理还能持续修正理解吗？</h4><p>省去的检查，可能也是发现误解、产生纠正信息的工作。这会不会改变助理后续学习的条件？</p><details><summary class="cursor-interaction">为什么优先它 · 和已有工作的关系</summary><p>它连接了“为用户省力”和“持续理解用户”这两个目标。主动询问是有力回应，仍需比较：回答这些问题是否又需要用户做回原来的检查工作。</p><p>减少编辑本来就是已有方法的收益，不能直接把它说成失败。</p><button class="ri-textbutton cursor-interaction" data-paper="0">查看相关论文与原文</button></details></article><article class="ri-candidate"><span class="ri-tiny ri-muted">问题 B</span><h4>过去的选择，什么时候足以指导新的情境？</h4><p>熟悉场景里预测准确，不一定意味着已经了解条件改变后的取舍。</p><details><summary class="cursor-interaction">这个问题的价值 · 与 A 的区别</summary><p>B 关注历史信息能够支持多远；A 关注形成理解以后，纠正信息还能否持续产生。两者都有价值，当前建议先讨论后者。</p></details></article></div><div class="ri-question">${icon('message-circle')}<div>你观察到的“少修改”，更多是回答已经合意，还是用户没有再仔细检查？<small>不知道也没关系，可以让助手继续解释或补查文献。</small></div></div>${state.messages.map(m=>`<div class="ri-message ${m.role==='user'?'user':''}"><strong>${m.role==='user'?'你':'交互演示'}</strong>${h(m.text)}</div>`).join('')}${composer()}<div class="ri-next"><span class="ri-tiny ri-muted">讨论已保留，推进后会沿用你的纠正</span>${btn('continue',(state.phase==='direction'?'继续深入比较':'继续整理研究主张')+' '+icon('arrow-right'),true)}</div><details style="margin-top:22px"><summary class="cursor-interaction">查看调研过程与分析方法</summary>${logs()}</details>`;}
  function logs(){return `<div class="ri-logline"><span class="ri-logtag">检索</span><div>按不同思路检索，筛选相关论文<br><small>初步发现 → 按相关度与时间选读</small></div></div><div class="ri-logline"><span class="ri-logtag">阅读</span><div>核对 CIPHER 的偏好更新规则<br><button class="ri-textbutton cursor-interaction" data-paper="0">查看论文及 Algorithm 1</button></div></div><div class="ri-logline"><span class="ri-logtag">分析方法</span><div>理解原文 · 比较已有回应 · 推导问题与动机</div></div><div class="ri-logline"><span class="ri-logtag">本轮变化</span><div>合并相近方向，保留已有方法取得的进展<br><button class="ri-textbutton cursor-interaction" data-action="changes">查看具体修订</button></div></div>`;}
  function running(){const error=state.phase==='error',stopped=state.phase==='stopped';return `${steps()}<div class="ri-running"><div class="ri-row">${error?icon('circle-alert'):stopped?icon('pause'):'<span class="ri-spinner" aria-label="正在运行"></span>'}<span class="ri-small ri-muted">${error?'模型连接暂时中断':stopped?'已停止，进度已保存':'正在深入比较'}</span></div><h3>${error?'这一步暂时没有完成':stopped?'随时可以从这里继续':'正在核对最接近工作的细节'}</h3><p class="ri-small ri-muted">${error?'网络连接失败 · 第 1 / 10 次重试 · 30 秒后自动重试':stopped?'已经完成的阅读和讨论会继续使用。':'当前阅读：PRELUDE / CIPHER · Algorithm 1 与相邻解释'}</p></div>${error?`<div class="ri-note warning">已保存之前的研究进度。可以立即重试，也可以检查模型连接。<div class="ri-row" style="margin-top:12px">${btn('retry','立即重试',true)}${btn('model','检查连接')}${btn('stop','停止任务')}</div></div><details style="margin-top:18px"><summary class="cursor-interaction">错误详情与其他情况</summary><p class="ri-small">网络、API、模型不可用或额度不足会显示具体原因。最多每 30 秒重试一次，共 10 次；仍失败则停下并保留进度。预算用完时可调整预算后继续。</p></details>`:stopped?btn('resume','恢复研究 '+icon('play'),true):`<div class="ri-note">正在运行，输入区暂时收起。完成当前阶段后会自动停下来与你讨论。</div><div style="margin-top:17px">${btn('stop',icon('square')+' 停止并保留进度')}</div>`}<h4 class="ri-small" style="margin-top:30px">已经完成的工作</h4>${logs()}<details style="margin-top:20px"><summary class="cursor-interaction">详细运行记录</summary><p class="ri-tiny ri-muted">阶段：逐个深入 · 已保存的阅读可恢复 · 记录包含任务摘要、引用校验和重试情况。</p></details>`;}
  function literature(){if(state.paper!==null)return paperDetail();const query=state.search.toLowerCase();let list=papers.map((p,i)=>({...p,i})).filter(p=>`${p.title} ${p.short} ${p.kind}`.toLowerCase().includes(query));if(state.sort==='recent')list.sort((a,b)=>b.year-a.year);return `<div class="ri-intro"><div><h3>文献与依据</h3><p>先看为什么读这篇，再按需打开全文和原文位置。</p></div>${btn('import-papers',icon('plus')+' 导入论文')}</div><div class="ri-row"><input class="ri-input" id="ri-paper-search" style="flex:1;width:auto" value="${h(state.search)}" placeholder="搜索已有论文" aria-label="搜索已有论文"><select class="ri-input" id="ri-paper-sort" style="width:auto" aria-label="论文排序"><option value="relevance" ${state.sort==='relevance'?'selected':''}>按相关度</option><option value="recent" ${state.sort==='recent'?'selected':''}>按时间</option></select></div><details style="margin-top:15px"><summary class="cursor-interaction">手动补查文献</summary><div class="ri-row"><input class="ri-input" id="ri-manual-query" style="flex:1;width:auto" placeholder="输入标题或检索词" aria-label="补查论文标题或检索词">${btn('manual-search','检索')}</div>${check('manual_fulltext','同时尝试获取正文')}</details><div class="ri-row ri-between" style="margin-top:19px"><span class="ri-tiny ri-muted">${list.length} 条记录 · 正文、摘要与检索计划分别标记</span><button class="ri-textbutton ri-tiny cursor-interaction" data-action="search-settings">调整范围与会议</button></div>${list.length?list.map(p=>`<article class="ri-paper"><div class="ri-row"><span class="ri-pill">${h(p.status)}</span><span>${h(p.venue)}</span><span>${h(p.kind)}</span></div><h4>${h(p.title)}</h4><p>${h(p.impact)}</p><div class="ri-row"><button class="ri-textbutton cursor-interaction" data-paper="${p.i}">阅读要点与依据 ${icon('arrow-right')}</button>${p.url?`<a href="${p.url}" target="_blank" rel="noopener noreferrer">论文链接 ↗</a>`:''}</div></article>`).join(''):'<div class="ri-empty">没有匹配的记录，可以换个关键词或手动补查。</div>'}${state.files.length?`<div class="ri-note" style="margin-top:18px">已选择的文件（预览）：${state.files.map(h).join('、')}<br>正式版会在导入后提取正文并显示读取状态。</div>`:''}`;}
  function paperDetail(){const p=papers[state.paper];return `<button class="ri-button ri-quiet cursor-interaction" data-action="paper-back">${icon('arrow-left')} 返回文献</button><div class="ri-stack" style="margin-top:18px"><span class="ri-pill">${h(p.status)} · ${h(p.venue)}</span><h3 class="ri-section-title">${h(p.title)}</h3>${p.url?`<div class="ri-row"><a href="${p.url}" target="_blank" rel="noopener noreferrer">打开论文 ↗</a><a href="${p.url.replace('/abs/','/pdf/')}" target="_blank" rel="noopener noreferrer">打开全文 ↗</a></div>`:''}<div class="ri-note"><strong>对当前问题有什么影响？</strong><p>${h(p.impact)}</p></div>${state.paper===0?`<section><h4 class="ri-small">方法实际上怎样做？</h4><p class="ri-small" style="margin-top:8px">从用户的修改中归纳偏好，按当前情境检索过去的偏好。编辑量很小时沿用当前估计；编辑量较大时重新解释修改，再写入历史。</p></section><section><h4 class="ri-small">原文依据</h4><div class="ri-quote"><span class="ri-pill">作者的方法描述</span><p style="margin-top:9px">“if cₜ ≤ δ then”</p><small class="ri-muted">Algorithm 1 · 阈值分支</small></div><p class="ri-small">这条规则说明了更新怎样发生；“用户有没有认真检查”仍是需要另行讨论的信息。</p></section>`:`<section><h4 class="ri-small">阅读重点</h4><p class="ri-small" style="margin-top:8px">比较它实际可用的信息、产生的效果，以及与当前研究问题的关系。</p></section>`}<details><summary class="cursor-interaction">展开完整论文分析</summary><div class="ri-small">研究问题 · 研究动机 · 核心洞见 · 具体方法 · 已有工作差异 · 实验设计 · 结果与解释 · 结论边界 · 研究启发</div></details>${btn('ask-paper','围绕这篇论文继续讨论')}</div>`;}
  const reportSections=[['背景','长期个人助理需要利用过去交流减少重复说明，同时理解用户在不同时间与情境下的选择。它越好用，用户就越可能把检查和判断也交给它。'],['现有方法','记忆检索、偏好学习和主动澄清已经帮助系统利用历史、吸收纠正。CIPHER 从用户修改中学习偏好，减少后续编辑，说明这条路线已有实际进展。'],['问题','用户少修改，可能是回答更合意，也可能是用户少检查了。被省去的检查，恰好可能是发现误解、产生纠正信息的工作。已有反馈利用机制正常发挥之后，这部分信息仍可能没有产生。'],['动机','如果维持准确理解始终要求用户重新审阅，助理实际省下的工作就值得重新理解。我们希望弄清，哪些正常互动能持续提供纠正，哪些仍依赖用户已经委托出去的检查。'],['研究主张','研究长期个性化带来的检查减少，如何影响纠正信息的产生，以及助理后续修正和复用用户理解的能力。']];
  function report(){if(state.phase!=='done')return `<div class="ri-empty">${icon('file-text')}<h3 style="margin-top:12px">研究主张会从讨论中形成</h3><p class="ri-small">先比较问题、说清动机。讨论完成后，点击“继续整理研究主张”。</p><div style="margin-top:20px">${btn('back-discuss','回到当前讨论',true)}</div></div>`;return `<div class="ri-row ri-between"><span class="ri-pill">研究主张 · 当前版本</span><div class="ri-row">${btn('download-md',icon('download')+' Markdown')}${btn('download-json','JSON')}</div></div><article class="ri-report"><div class="ri-eyebrow" style="margin-top:27px">Research question</div><h3>用户少检查后，助理还能持续修正对用户的理解吗？</h3>${reportSections.map(([title,text],i)=>`<section><h4>${title}</h4><p>${text}${i===1?' <button class="ri-cite cursor-interaction" data-paper="0">CIPHER ↗</button>':''}</p></section>`).join('')}</article><div class="ri-next"><span class="ri-tiny ri-muted">自动保存到 idea-时间戳 / report.md</span>${btn('revise','继续讨论与修订 '+icon('message-circle'),true)}</div><details style="margin-top:20px"><summary class="cursor-interaction">版本、保存位置与详细材料</summary><div class="ri-stack ri-small"><div>当前版本保留本轮纠正；历史讨论和原文依据随项目保存。</div>${btn('changes','查看修订记录')}${btn('output','更改保存目录')}${btn('export','重新导出已有报告')}</div></details>`;}
  function memory(){return `<div class="ri-intro"><div><h3>要点与历史</h3><p>知道它记住了什么，也能找到你当时怎么说。</p></div></div><div class="ri-subtabs">${[['notes','现行要点'],['changes','本轮修改'],['history','完整对话']].map(([v,l])=>`<button class="ri-subtab cursor-interaction" data-memory="${v}" aria-current="${state.memory===v?'page':'false'}">${l}</button>`).join('')}</div>${state.memory==='notes'?notes.map((x,i)=>`<div class="ri-memoryitem"><div class="ri-row ri-between"><span class="ri-pill">持续研究要求</span><button class="ri-textbutton ri-tiny cursor-interaction" data-correct="${i}">纠正这条</button></div><p>${h(x)}</p><button class="ri-textbutton ri-tiny cursor-interaction" data-action="history">查看来源原话</button></div>`).join('')+'<details style="margin-top:18px"><summary class="cursor-interaction">已结束的临时要求</summary><p class="ri-small">“这轮先简明解释” · 仅本轮有效 · 已结束。原话仍保留，不作为之后的长期偏好。</p></details>':state.memory==='changes'?`<div class="ri-stack"><div class="ri-note">本轮修改已保存，后续研究会使用修订后的版本。</div><div class="ri-memoryitem"><span class="ri-tiny ri-muted">问题理解</span><p>从“记忆没有及时更新”改为“用户参与改变后，纠正信息如何产生”。</p></div><div class="ri-memoryitem"><span class="ri-tiny ri-muted">已有工作比较</span><p>保留已有情境学习和主动澄清的作用，不把编辑减少直接说成失败。</p><button class="ri-textbutton cursor-interaction" data-paper="0">对应论文与依据</button></div></div>`:`<label class="ri-field"><span>查找过去的讨论</span><input id="ri-history-search" placeholder="例如：记忆过时、少修改、资源限制"></label><div id="ri-history-items">${historyRows('')}</div>`}`;}
  function historyRows(q){return [{role:'你 · 方向讨论',text:'不要预先认定问题一定来自记忆过时，也不要把普通情境推荐直接说成创新。'},{role:'研究助手 · 方向讨论',text:'先保留不同解释，再比较已有方法正常发挥后还可能留下什么困难。'},{role:'你 · 问题讨论',text:'不要把少修改直接说成问题，要比较用户是不是减少了检查。'},...state.messages.map(x=>({role:x.role==='user'?'你':'交互演示',text:x.text}))].filter(x=>x.text.includes(q)).map(x=>`<div class="ri-message"><strong>${h(x.role)}</strong>${h(x.text)}</div>`).join('')||'<div class="ri-empty">没有匹配的对话。</div>';}
  function originalSettings(){return `<div class="ri-intro"><div><h3>研究设置</h3><p>常用选项放在前面。设置保存到当前项目，可用于下一次研究。</p></div>${btn('back-discuss','返回研究')}</div><div class="ri-subtabs">${[['model','模型与账户'],['search','文献范围'],['budget','预算与保存'],['skills','分析方法'],['system','更多设置']].map(([v,l])=>`<button class="ri-subtab cursor-interaction" data-settings="${v}" aria-current="${state.settings===v?'page':'false'}">${l}</button>`).join('')}</div><form id="ri-settings-form">${settingsBody()}<div class="ri-settings-end"><span class="ri-tiny ri-muted">运行中的任务使用启动时的设置</span><button class="ri-button ri-primary cursor-interaction" type="button" data-action="save-settings">保存设置</button></div></form>`;}
  function advancedSettingsBody(){if(state.settings==='model')return `<div class="ri-formgrid">${select('backend','模型连接方式',[['codex','本地 Codex CLI'],['claude','本地 Claude Code'],['openai','OpenAI-compatible API'],['anthropic','Anthropic API']],state.backend,'已有本地登录可以直接沿用。')}${modelSelect()}</div>${['codex','claude'].includes(state.backend)?`<div class="ri-account">${icon('circle-user-round')}<div><strong>${state.backend==='codex'?'Codex':'Claude Code'} 本地登录</strong><small>示例状态：已登录 · 使用本机认证</small></div><button type="button" class="ri-button cursor-interaction" style="margin-left:auto" data-action="check-account">检查连接</button></div>`:`<div class="ri-formgrid" style="margin-top:18px">${field('base_url','API 地址',state.backend==='anthropic'?'https://api.anthropic.com/v1':'https://api.openai.com/v1')}${field('api_key_env','密钥环境变量名',state.backend==='anthropic'?'ANTHROPIC_API_KEY':'OPENAI_API_KEY','text','读取本机环境变量；此处不显示密钥内容。')}</div>`}<div style="margin-top:18px">${state.backend==='codex'?select('effort','思考强度',[['inherit','沿用 Codex 配置'],['none','none'],['minimal','minimal'],['low','low · 较快'],['medium','medium · 适中'],['high','high · 更充分'],['xhigh','xhigh'],['max','max'],['ultra','ultra']],state.effort,'可用档位以所选模型实际支持为准。'):'<div class="ri-note">此后端沿用自身的思考设置。</div>'}</div><details style="margin-top:19px"><summary class="cursor-interaction">本地模型目录与高级连接设置</summary><div class="ri-stack"><p class="ri-small">本地记录：gpt-6.1-sol。目录记录不等于账户实时可用列表。</p><div class="ri-formgrid">${field('codex_profile','Codex 配置档（选填）','')}${field('codex_bin','Codex 路径','codex')}${field('max_output_tokens','单次最大输出 token',8192,'number')}${select('api_max_tokens_field','API 输出长度字段',['max_completion_tokens','max_tokens'],'max_completion_tokens')}</div>${btn('login-help','查看登录与 API 配置说明')}</div></details>`;
    if(state.settings==='search')return `<div class="ri-formgrid">${select('auto_search','资料来源',[['yes','联网检索＋已导入资料'],['no','只使用已导入资料']],'yes')}${select('search_source','检索渠道',[['hybrid','会议与 arXiv'],['arxiv','arXiv'],['openalex','OpenAlex / 会议索引']],'hybrid')}${select('date_mode','arXiv 时间方式',[['rolling','动态滚动窗口'],['fixed','固定日期范围']],state.fields.date_mode||'rolling')}${select('conference_policy','会议届次',[['latest','优先最新公开一届'],['window','按日期窗口筛选']],'latest','最新一届尚不可获取时使用上一届。')}</div><div class="ri-formgrid" style="margin-top:17px">${state.fields.date_mode==='fixed'?field('since','起始日期','2026-05-01','date')+field('until','截止日期','2026-11-01','date'):field('strategy_months','背景与思路参考 · 最近月数',12,'number')+field('novelty_months','近期工作对照 · 最近月数',6,'number')}</div><div class="ri-row ri-between" style="margin:21px 0 13px"><span class="ri-small">参考会议</span><div class="ri-row">${btn('venues-all','全部选中')}${btn('venues-core','LLM / NLP 常用')}</div></div><div class="ri-venues">${venues.map(x=>`<label class="ri-check"><input type="checkbox" data-venue="${x}" ${state.chosenVenues.has(x)?'checked':''}>${x}</label>`).join('')}</div><details style="margin-top:21px"><summary class="cursor-interaction">分类、查询规模与正文读取</summary><div class="ri-stack">${check('cs_only','限定计算机领域（CS）')}${field('arxiv_categories','arXiv 分类','cs.*','text','可指定 cs.CL、cs.AI、cs.LG 等。')}${field('search_results_per_query','每个查询最多召回',20,'number')}${check('fetch_full_text','自动尝试获取正文')}${check('deep_reading','对关键论文进行分段阅读')}<div class="ri-formgrid">${field('source_chars','单次原文字符上限',24000,'number')}${field('max_paper_read_chunks','每篇最多初读分块',3,'number')}${field('max_followup_reads','定向补读上限',2,'number')}${field('search_api_key_env','检索 API 密钥变量名（选填）','')}</div></div></details>`;
    if(state.settings==='budget')return `<div class="ri-note">当前示例用量：模型调用 26 次 · 运行 57 分钟。等待你讨论的时间不计入研究预算。</div><div class="ri-formgrid" style="margin-top:20px">${field('calls','总调用上限',state.calls,'number')}${field('minutes','总运行时间 · 分钟',state.minutes,'number')}${field('papers','初次选读论文数',state.papers,'number','召回数量与精读数量分别控制。')}${field('max_candidates','优先研究问题数',1,'number')}</div><hr class="ri-rule"><div class="ri-formgrid">${field('output_dir','结果保存目录','代码所在目录','text','文件夹固定为 idea-时间戳，内部保存报告和详细依据。')}${field('constraints','资源与研究约束',state.fields.constraints||'由用户补充；未知条件保持未知。')}</div><details style="margin-top:18px"><summary class="cursor-interaction">超时、重试与项目位置</summary><div class="ri-stack">${field('timeout_s','单次调用超时 · 秒',1200,'number')}<p class="ri-small">遇到可重试错误，每 30 秒重试一次，最多 10 次。超过预算会保留进度并停止。</p>${field('project_dir','项目目录','./research-projects/personal-assistant','text','项目保存完整会话、设置和运行检查点。')}</div></details>`;
    if(state.settings==='skills')return `<div class="ri-note">分析方法会按研究阶段自动加载，日常使用无需手动选择。</div><div style="margin:20px 0">${check('builtin_skills','启用内置研究 skill')}</div><div class="ri-stack">${['读取原文依据','理解论文问题与方法','核对主张和结果','推导问题与动机','对比已有工作'].map(x=>`<div class="ri-row ri-between ri-small"><span>${icon('check')} ${x}</span><span class="ri-tiny ri-muted">随阶段使用</span></div>`).join('')}</div><details style="margin-top:22px"><summary class="cursor-interaction">添加本地 skill 与查看全部指导</summary><div class="ri-stack">${field('skill_paths','已选 skill 路径','', 'text','可以选择一个或多个本地 SKILL.md。')}${field('skill_roots','额外查找目录','')}${field('skill_max_chars','指导文本字符预算',48000,'number')}<div class="ri-row">${btn('skill-import','选择 SKILL.md')}${btn('skill-clear','清除额外 skill')}</div>${state.customSkills.length?`<p class="ri-small">已选择：${state.customSkills.map(h).join('、')}</p>`:''}<details><summary class="cursor-interaction">查看指导内容与旧项目兼容项</summary><p class="ri-small">先承接已有贡献，再解释关键困难与动机；论文事实、分析和猜想分开。方法机制、可行性与证伪设计三项 skill 保留用于旧流程，当前问题研究按任务加载。</p><p class="ri-tiny ri-muted">加载指导文字，不自动执行 skill 的脚本。</p></details></div></details>`;
    return `<div class="ri-stack"><div><h4 class="ri-small">运行与显示</h4><div class="ri-stack" style="margin-top:13px">${check('show_details','展开详细过程输出',false)}${select('run_mode','新研究默认方式',[['interactive','调研后停下来讨论'],['automatic','自动完成整轮研究']],'interactive')}</div></div><hr class="ri-rule"><div class="ri-row ri-between"><div><h4 class="ri-small">环境检查</h4><p class="ri-tiny ri-muted">检查本地模型 CLI、PDF 读取工具和项目设置。</p></div>${btn('doctor','检查环境')}</div><div class="ri-row">${btn('config','查看全部配置')}${btn('error-preview','预览错误提示')}${btn('demo','试用演示研究')}</div><details><summary class="cursor-interaction">启动、退出与浏览器关闭</summary><p class="ri-small">计划入口：<code>research-idea web</code>，自动打开 localhost。关闭网页保留本地项目；重新打开可查看进度。停止任务与关闭本地服务分开操作。</p><div class="ri-row" style="margin-top:12px">${btn('stop','停止当前任务')}${btn('shutdown','关闭本地服务')}</div></details></div>`;
  }
  function help(){return `<div class="ri-intro"><div><h3>从一个方向，到一个值得研究的问题</h3><p>日常只需要输入、讨论、继续。其他选项按需打开。</p></div></div>${[['说出你的想法','输入研究方向，也可以添加论文、文字材料和资源条件。'],['边调研，边讨论','先梳理已有方法和重要方向，再深入比较。你可以随时追问、纠正，或要求补读。'],['整理研究主张','讨论到满意后继续，形成背景、现有方法、问题、动机与研究主张。之后仍能继续修订。']].map(([t,p],i)=>`<div class="ri-helpstep"><b>${i+1}</b><div><strong class="ri-small">${t}</strong><p>${p}</p></div></div>`).join('')}<div class="ri-row" style="margin:24px 0">${btn('new','开始一个研究',true)}${btn('demo','看看演示')}</div><details><summary class="cursor-interaction">所有功能在哪里？</summary><div class="ri-helpmap"><span>项目侧栏</span><span>新建、先保存、打开项目、切换历史研究。</span><span>讨论</span><span>修改主题、上传文字、反复追问、查看问题、重新构思、继续下一步。</span><span>运行状态</span><span>当前阶段、用量、停止与恢复、错误原因、自动重试和手动重试。</span><span>文献</span><span>导入 PDF / TXT / Markdown / JSON，手动检索、排序、正文、论文卡、原文证据与链接。</span><span>研究主张</span><span>当前报告、继续修订、版本记录、重新导出 Markdown / JSON、保存位置。</span><span>要点与历史</span><span>当前要求、原话出处、临时要求、实际修改、历史对话搜索。</span><span>模型与账户</span><span>Codex、Claude Code、两类 API，本地登录信息、模型目录、思考强度、配置档。</span><span>文献设置</span><span>渠道、CS 分类、动态或固定时间、会议及届次、召回与正文读取。</span><span>预算与保存</span><span>调用、时间、选读数量、问题数量、超时、资源约束、输出与项目目录。</span><span>分析方法</span><span>内置 skill、本地 skill 的查看、选择、额外查找路径与清除。</span><span>更多设置</span><span>详细输出、自动或讨论模式、环境检查、全部配置、离线演示、关闭服务。</span></div></details><div class="ri-note" style="margin-top:22px">Web 与 CLI 计划共用同一研究引擎和项目记录。你不需要在网页里记住命令。</div>`;}
  function render(){root.querySelector('#ri-phase-preview').value=state.phase;root.querySelector('#ri-projects').innerHTML=projects.map((x,i)=>`<button class="ri-project cursor-interaction" data-project="${i}" aria-current="${state.project===i&&state.phase!=='new'?'page':'false'}"><strong>${h(x)}</strong><small>${i===0?'今天 · 问题讨论':i===1?'昨天 · 已保存':'上周 · 已保存'}</small></button>`).join('');root.querySelector('#ri-project-title').textContent=state.phase==='new'?'新的研究':projects[state.project];root.querySelector('#ri-breadcrumb').textContent=state.phase==='new'?'本地工作空间':'我的研究 / '+(state.project===0?'个人助理':state.project===1?'文本压缩':'自我改进');root.querySelector('#ri-model-label').textContent=(state.model||'沿用模型')+' · '+(state.backend==='codex'?state.effort:'沿用配置');root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===state.page?'page':'false'));root.querySelector('#ri-content').innerHTML=state.page==='discussion'?discussion():state.page==='papers'?literature():state.page==='report'?report():state.page==='memory'?memory():state.page==='settings'?settings():help();const states={new:'准备开始',running:'运行中 · 阅读与比较',direction:'已暂停 · 等你讨论',problem:'已暂停 · 等你讨论',done:'已完成 · 可以继续修订',error:'等待重试 · 进度已保存',stopped:'已停止 · 可以恢复'};root.querySelector('#ri-status').innerHTML='<span class="ri-dot"></span>'+states[state.phase];root.querySelector('#ri-budget').textContent=`模型调用 ${state.phase==='new'?0:26} / ${state.calls} · 用时 ${state.phase==='new'?0:57} / ${state.minutes} 分钟`;if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
  function navigate(page){state.page=page;state.paper=null;render();persist();}
  function toSettings(tab){state.settings=tab;state.page='settings';render();persist();}
  function pickFile(kind){const input=document.createElement('input');input.type='file';input.multiple=kind==='papers'||kind==='skill';input.accept=kind==='papers'?'.pdf,.txt,.md,.json':kind==='skill'?'.md':'.txt,.md';input.onchange=async()=>{const fs=Array.from(input.files||[]);if(!fs.length)return;if(kind==='papers'){state.files.push(...fs.map(f=>f.name));navigate('papers');notify('已选择文件；此预览不会上传或调用研究模型。');}else if(kind==='skill'){state.customSkills.push(...fs.map(f=>f.name));render();notify('已在预览中选中本地指导文件。');}else{const text=await fs[0].text();if(kind==='topic')state.topic=text;else state.draft=text;state.page='discussion';render();notify('文字已放入输入框，你可以先修改再发送。');}};input.click();}
  function download(format){const data=format==='json'?JSON.stringify({preview:true,title:'用户少检查后，助理还能持续修正理解吗？',sections:reportSections},null,2):'# 界面预览示例 · 非新研究运行\n\n'+reportSections.map(([a,b])=>'## '+a+'\n\n'+b).join('\n\n');const url=URL.createObjectURL(new Blob([data],{type:format==='json'?'application/json':'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='research-preview.'+(format==='json'?'json':'md');a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已导出界面中的示例内容。');}
  root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.page){navigate(b.dataset.page);return;}if(b.dataset.settings){state.settings=b.dataset.settings;render();return;}if(b.dataset.memory){state.memory=b.dataset.memory;render();return;}if(b.dataset.paper!==undefined){state.paper=Number(b.dataset.paper);state.page='papers';render();return;}if(b.dataset.project!==undefined){state.project=Number(b.dataset.project);state.phase=state.project===0?'problem':'new';state.topic=state.project===0?'':projects[state.project];state.page='discussion';render();notify(state.project===0?'已打开示例讨论。':'该项目以主题草稿展示，可以从这里开始。');return;}if(b.dataset.example){state.topic=b.dataset.example;render();return;}if(b.dataset.correct!==undefined){state.draft='我想纠正这条研究要求：'+notes[Number(b.dataset.correct)];state.page='discussion';render();return;}
    const action=b.dataset.action;if(!action)return;
    if(action==='new'){state.phase='new';state.page='discussion';state.topic='';state.messages=[];state.draft='';render();}
    else if(action==='start'||action==='save-draft'){if(!state.topic.trim()){notify('先写下你想研究的方向。');root.querySelector('#ri-topic')?.focus();return;}if(action==='save-draft'){notify('主题草稿已保留在这次预览中。');return;}projects[0]=state.topic.trim().slice(0,26);state.project=0;state.phase='running';state.page='discussion';render();notify('已切换到运行状态示例；用上方“预览阶段”查看后续讨论。');}
    else if(action==='settings'||action==='model')toSettings('model');else if(action==='search-settings')toSettings('search');else if(action==='budget'||action==='output')toSettings('budget');else if(action==='help'||action==='login-help')navigate('help');
    else if(action==='back-discuss'||action==='revise'){if(state.phase==='done'&&action==='revise')state.phase='problem';navigate('discussion');}
    else if(action==='send'){if(!state.draft.trim()){notify('写下你的意见，再发送。');return;}state.messages.push({role:'user',text:state.draft},{role:'assistant',text:'意见已加入这次界面演示。正式版将在这里回应你的分歧、更新问题稿，并显示本轮实际修改。'});state.draft='';render();notify('这次是交互预览，没有发送真实模型请求。');}
    else if(action==='continue'){state.phase=state.phase==='direction'?'running':'done';state.page=state.phase==='done'?'report':'discussion';render();notify('已预览下一阶段；实际产品会调用研究引擎后更新内容。');}
    else if(action==='stop'){state.phase='stopped';navigate('discussion');}else if(action==='retry'||action==='resume'||action==='replan'){state.phase='running';navigate('discussion');notify(action==='replan'?'预览：使用现有材料重新探索方向，保留对话。':'已切换到恢复运行的示例。');}
    else if(action==='import-papers')pickFile('papers');else if(action==='topic-file')pickFile('topic');else if(action==='input-file')pickFile('input');else if(action==='skill-import')pickFile('skill');else if(action==='skill-clear'){state.customSkills=[];state.fields.skill_paths='';render();}
    else if(action==='paper-back'){state.paper=null;render();}else if(action==='ask-paper'){state.draft='请结合 '+papers[state.paper].short+' 的方法细节，解释它对当前问题的影响。';state.phase='problem';navigate('discussion');}
    else if(action==='changes'||action==='history'){state.memory=action; navigate('memory');}else if(action==='venues-all'){state.chosenVenues=new Set(venues);render();}else if(action==='venues-core'){state.chosenVenues=new Set(venues.slice(0,10));render();}
    else if(action==='download-md'||action==='download-json')download(action==='download-md'?'md':'json');else if(action==='export'){download('md');}
    else if(action==='check-account'||action==='doctor')notify('预览：正式版会检查本机连接与环境；这里没有读取你的账户或运行检测。');
    else if(action==='refresh-models')notify('预览：正式版会从当前后端刷新模型列表；这里展示示例模型，未读取本机账户。');
    else if(action==='save-settings'){state.model=state.fields.model??state.model;state.effort=state.fields.effort??state.effort;state.calls=Number(state.fields.calls??state.calls);state.minutes=Number(state.fields.minutes??state.minutes);state.papers=Number(state.fields.papers??state.papers);render();notify('设置已保存在这次界面预览中。');}
    else if(action==='error-preview'){state.phase='error';navigate('discussion');}else if(action==='demo'){state.phase='problem';state.project=0;navigate('discussion');notify('当前为示例研究，未调用真实模型。');}
    else if(action==='manual-search'){const q=root.querySelector('#ri-manual-query')?.value||'';notify(q.trim()?'预览：将按当前范围检索“'+q+'”，再由你查看或选读。':'先输入论文标题或检索词。');}
    else if(action==='open'){root.querySelector('#ri-content').innerHTML=`<div class="ri-intro"><div><h3>打开已有项目</h3><p>选择本机的研究项目，恢复设置、对话和进度。</p></div></div>${field('open_path','项目目录','./research-projects/my-idea')}<div class="ri-row" style="margin-top:20px">${btn('open-example','打开项目',true)}${btn('back-discuss','返回')}</div><p class="ri-tiny ri-muted" style="margin-top:14px">正式版会在本机读取所选目录。这个预览只展示入口。</p>`;}
    else if(action==='open-example'){state.project=0;state.phase='problem';navigate('discussion');notify('已打开示例项目；未读取本机目录。');}
    else if(action==='config'){root.querySelector('#ri-content').innerHTML=`<div class="ri-intro"><h3>当前项目配置</h3>${btn('settings','返回设置')}</div><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px">${h(JSON.stringify({backend:state.backend,model:state.model,reasoning_effort:state.effort,max_calls:state.calls,max_minutes:state.minutes,max_papers:state.papers,venues:[...state.chosenVenues],...state.fields},null,2))}</pre>`;}
    else if(action==='shutdown'){notify('预览：实际操作会关闭本地服务，已保存的项目仍然保留。');}persist();
  });
  root.addEventListener('input',event=>{const el=event.target;if(el.id==='ri-draft')state.draft=el.value;else if(el.id==='ri-topic')state.topic=el.value;else if(el.id==='ri-history-search')root.querySelector('#ri-history-items').innerHTML=historyRows(el.value);else if(el.name&&el.type!=='checkbox')state.fields[el.name]=el.value;});
  root.addEventListener('change',event=>{const el=event.target;if(el.id==='ri-phase-preview'){state.phase=el.value;state.page=el.value==='done'?'report':'discussion';render();persist();return;}if(el.dataset.venue){if(el.checked)state.chosenVenues.add(el.dataset.venue);else state.chosenVenues.delete(el.dataset.venue);return;}if(el.type==='checkbox'&&el.name)state.fields[el.name]=el.checked;if(el.id==='ri-paper-search'){state.search=el.value;render();}if(el.id==='ri-paper-sort'){state.sort=el.value;render();}if(el.name==='backend'){state.backend=el.value;state.fields.backend=el.value;state.model=el.value==='codex'?'gpt-6.1-sol':'';state.fields.model=state.model;render();}if(el.name==='date_mode'){state.fields.date_mode=el.value;render();}});
  root.addEventListener('submit',event=>{event.preventDefault();if(event.target.id!=='ri-settings-form')return;if(!event.target.reportValidity())return;state.model=state.fields.model??state.model;state.effort=state.fields.effort??state.effort;state.calls=Number(state.fields.calls??state.calls);state.minutes=Number(state.fields.minutes??state.minutes);state.papers=Number(state.fields.papers??state.papers);render();notify('设置已用于这次预览；正式版会保存到当前项目，下一次调用生效。');persist();});
  window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState?.privateContent;if(s&&s.design===2&&['discussion','papers','report','memory','settings','help'].includes(s.page)&&['new','running','direction','problem','done','error','stopped'].includes(s.phase)){state.page=s.page;state.phase=s.phase;render();}});
  function modelSelect(){return select('model','模型',state.backend==='codex'?[['gpt-6.1-sol','gpt-6.1-sol'],['','使用后端默认模型']]:[['','使用后端默认模型']],state.model,'自动获取 · 当前为示例列表');}
  function settingsBody(){if(state.settings!=='model')return advancedSettingsBody();return `<div class="ri-formgrid">${select('backend','连接方式',[['codex','Codex · 本机账号'],['claude','Claude Code · 本机账号'],['openai','OpenAI-compatible API'],['anthropic','Anthropic API']],state.backend)}${modelSelect()}${state.backend==='codex'?select('effort','思考深度',[['low','快速'],['medium','均衡'],['high','深入（推荐）']],state.effort):''}</div><div class="ri-row ri-between" style="margin-top:18px"><span class="ri-small ri-muted">${state.backend==='codex'||state.backend==='claude'?'沿用本机登录 · 示例状态':'使用已配置的 API 连接'}</span>${btn('refresh-models',icon('refresh-cw')+' 刷新模型')}</div><details style="margin-top:24px"><summary class="cursor-interaction">账号与连接详情</summary>${advancedSettingsBody()}</details>`;}
  function settings(){return `<div class="ri-intro"><h3>设置</h3>${btn('back-discuss','返回对话')}</div><form id="ri-settings-form">${state.settings==='model'?settingsBody():advancedSettingsBody()}<details class="ri-advanced" ${state.settings!=='model'?'open':''}><summary class="cursor-interaction">更多设置</summary><div class="ri-subtabs">${[['model','模型与账号'],['search','文献范围'],['budget','预算与保存'],['skills','分析方法'],['system','其他']].map(([v,l])=>`<button type="button" class="ri-subtab cursor-interaction" data-settings="${v}" aria-current="${state.settings===v?'page':'false'}">${l}</button>`).join('')}</div></details><div class="ri-settings-end"><span class="ri-tiny ri-muted">其他选项使用默认设置即可</span><button class="ri-button ri-primary cursor-interaction" type="button" data-action="save-settings">保存设置</button></div></form>`;}
  function welcome(){return `<div class="ri-welcome"><h3>你想研究什么？</h3><p>说出你的想法，我们一起读论文、找问题、想清楚动机。</p><div class="ri-composer"><textarea id="ri-topic" aria-label="研究方向" placeholder="比如：我想让个人助理越用越懂我，但不想总是纠正它……">${h(state.topic)}</textarea><div class="ri-row ri-between">${btn('topic-file',icon('paperclip')+' 添加材料')}${btn('start','开始 '+icon('arrow-up'),true)}</div></div><details class="ri-advanced"><summary class="cursor-interaction">补充论文或研究条件</summary><div class="ri-stack">${btn('import-papers','添加论文')}<label class="ri-field"><span>研究条件（选填）</span><textarea name="constraints" placeholder="研究范围、可用资源，或其他想法">${h(state.fields.constraints||'')}</textarea></label>${btn('save-draft','保存草稿')}</div></details><p class="ri-welcomehint">先调研，再和你讨论；你可以随时追问和修改。</p></div>`;}
  function discussion(){if(state.phase==='new')return welcome();if(['running','error','stopped'].includes(state.phase))return running();return `<div class="ri-conversation"><div class="ri-speaker">${icon('sparkles')} Research-idea <span>等你讨论</span></div><p>我梳理了记忆检索、偏好学习和主动询问这几类方法。它们都在帮助助理更懂用户，但接下来有两个值得深挖的问题。</p><h4>1. 用户少检查后，助理还能持续修正理解吗？</h4><p>助理越省心，用户可能越少检查它。但检查恰恰也是发现误解、提供纠正的过程。如果这部分交流减少了，助理之后靠什么继续了解用户？</p><h4>2. 过去的选择，能不能用于新的情境？</h4><p>一个人在熟悉场景里的选择，不一定能说明条件变化后他会怎么选。已有偏好在什么时候还适用，需要怎样判断？</p><p><strong>我建议先讨论第一个。</strong>它直接关系到“越用越省心”能否持续。主动询问可能有帮助，但如果回答问题仍要求用户重新检查，是否又把工作交还给了用户？</p><details><summary class="cursor-interaction">看看论文依据与比较过程</summary>${logs()}${btn('replan','重新比较其他问题')}</details></div>${state.messages.map(m=>`<div class="ri-message ${m.role==='user'?'user':''}"><strong>${m.role==='user'?'你':'交互演示'}</strong>${h(m.text)}</div>`).join('')}<div class="ri-next"><span class="ri-small ri-muted">你可以继续聊，也可以推进下一步。</span>${btn('continue','继续 '+icon('arrow-right'))}</div>${composer()}`;}
  render();
  if(globalThis.Tweak){const design={compactSidebar:false};const tweak=new Tweak({container:root,onChange:()=>{root.dataset.compact=String(design.compactSidebar);}});tweak.addToggle(design,'compactSidebar',{label:'更紧凑的项目侧栏'});}
})();
</script>
