    {title:&#x27;Aligning LLM Agents by Learning Latent Preference from User Edits&#x27;,short:&#x27;PRELUDE / CIPHER&#x27;,venue:&#x27;NeurIPS 2024&#x27;,year:2024,status:&#x27;已阅读全文&#x27;,kind:&#x27;学习用户偏好&#x27;,url:&#x27;https://arxiv.org/abs/2404.15269&#x27;,impact:&#x27;用户的编辑可以转化成偏好，帮助减少后续修改。它是当前问题必须认真比较的已有回应。&#x27;},
    {title:&#x27;Context Steering: Controllable Personalization at Inference Time&#x27;,short:&#x27;Context Steering&#x27;,venue:&#x27;arXiv · cs&#x27;,year:2024,status:&#x27;已阅读全文&#x27;,kind:&#x27;应用已知偏好&#x27;,url:&#x27;https://arxiv.org/abs/2405.01768&#x27;,impact:&#x27;给定用户偏好，已有方法可以影响新请求的回答。跨请求使用偏好本身不能直接当作新的问题。&#x27;},
    {title:&#x27;待补充的最接近工作&#x27;,short:&#x27;主动偏好获取&#x27;,venue:&#x27;检索计划&#x27;,year:2026,status:&#x27;待检索&#x27;,kind:&#x27;当前阅读问题&#x27;,url:&#x27;&#x27;,impact:&#x27;重点查清：主动询问取得哪些信息，是否仍要求用户重新检查已经委托的内容。&#x27;}
  ];
  const notes = [&#x27;利用过去交流减少用户反复交代，同时理解不同情境下的选择。&#x27;,&#x27;不预设困难一定来自记忆过时；先看现有方法已经解决什么。&#x27;,&#x27;只形成背景、现有方法、问题、动机与研究主张。&#x27;];
  const saved = window.openai?.widgetState?.privateContent;
  if(saved &amp;&amp; saved.design===2 &amp;&amp; [&#x27;discussion&#x27;,&#x27;papers&#x27;,&#x27;report&#x27;,&#x27;memory&#x27;,&#x27;settings&#x27;,&#x27;help&#x27;].includes(saved.page)){state.page=saved.page;if([&#x27;new&#x27;,&#x27;running&#x27;,&#x27;direction&#x27;,&#x27;problem&#x27;,&#x27;done&#x27;,&#x27;error&#x27;,&#x27;stopped&#x27;].includes(saved.phase))state.phase=saved.phase;}
  const persist = () =&gt; {window.openai?.setWidgetState?.({modelContent:{preview:&#x27;Research-idea 0.8.0&#x27;,page:state.page,phase:state.phase},privateContent:{design:2,page:state.page,phase:state.phase}})?.catch(()=&gt;{});};
  const notify = text =&gt; {root.querySelector(&#x27;#ri-notice&#x27;).textContent=text;};
  const field = (name,label,value,type=&#x27;text&#x27;,hint=&#x27;&#x27;) =&gt; `&lt;label class=&quot;ri-field&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;input name=&quot;${name}&quot; type=&quot;${type}&quot; value=&quot;${h(state.fields[name]??value)}&quot; ${type===&#x27;number&#x27;?&#x27;min=&quot;1&quot; step=&quot;1&quot;&#x27;:&#x27;&#x27;}&gt;${hint?`&lt;small&gt;${hint}&lt;/small&gt;`:&#x27;&#x27;}&lt;/label&gt;`;
  const select = (name,label,options,value,hint=&#x27;&#x27;) =&gt; `&lt;label class=&quot;ri-field&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;select name=&quot;${name}&quot;&gt;${options.map(x=&gt;{const [v,l]=Array.isArray(x)?x:[x,x];return `&lt;option value=&quot;${h(v)}&quot; ${String(state.fields[name]??value)===String(v)?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${h(l)}&lt;/option&gt;`}).join(&#x27;&#x27;)}&lt;/select&gt;${hint?`&lt;small&gt;${hint}&lt;/small&gt;`:&#x27;&#x27;}&lt;/label&gt;`;
  const check = (name,label,yes=true) =&gt; `&lt;label class=&quot;ri-check&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;${name}&quot; ${(state.fields[name]??yes)?&#x27;checked&#x27;:&#x27;&#x27;}&gt;${label}&lt;/label&gt;`;
  const steps = () =&gt; {const current={new:0,running:2,direction:1,problem:3,done:4,error:2,stopped:2}[state.phase];return `&lt;div class=&quot;ri-steps&quot; aria-label=&quot;研究进度&quot;&gt;${[&#x27;调研方向&#x27;,&#x27;讨论方向&#x27;,&#x27;深入比较&#x27;,&#x27;讨论问题&#x27;,&#x27;研究主张&#x27;].map((x,i)=&gt;`${i?&#x27;&lt;span class=&quot;ri-stepsep&quot;&gt;&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;span class=&quot;ri-step ${i===current?&#x27;current&#x27;:&#x27;&#x27;}&quot; ${i===current?&#x27;aria-current=&quot;step&quot;&#x27;:&#x27;&#x27;}&gt;&lt;span class=&quot;ri-stepnum&quot;&gt;${i&lt;current?&#x27;✓&#x27;:i+1}&lt;/span&gt;${x}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`};
  function composer(){return `&lt;div class=&quot;ri-composer&quot;&gt;&lt;textarea id=&quot;ri-draft&quot; aria-label=&quot;给研究助手的意见&quot; placeholder=&quot;直接说哪里不合理，或让它把一个地方讲清楚…&quot;&gt;${h(state.draft)}&lt;/textarea&gt;&lt;div class=&quot;ri-row ri-between&quot;&gt;&lt;div class=&quot;ri-row&quot;&gt;&lt;button class=&quot;ri-button ri-quiet cursor-interaction&quot; data-action=&quot;input-file&quot;&gt;${icon(&#x27;paperclip&#x27;)} 添加文字材料&lt;/button&gt;&lt;span class=&quot;ri-tiny ri-muted&quot;&gt;可以反复讨论&lt;/span&gt;&lt;/div&gt;${btn(&#x27;send&#x27;,&#x27;发送 &#x27;+icon(&#x27;arrow-up&#x27;),true)}&lt;/div&gt;&lt;/div&gt;`;}
  function welcome(){return `&lt;div class=&quot;ri-welcome&quot;&gt;&lt;div class=&quot;ri-eyebrow&quot;&gt;A good question is a good beginning&lt;/div&gt;&lt;h3&gt;你想研究什么？&lt;br&gt;先从一个想法开始。&lt;/h3&gt;&lt;p&gt;梳理文献，一起找到重要的问题，再把研究动机想清楚。&lt;/p&gt;&lt;div class=&quot;ri-composer&quot;&gt;&lt;textarea id=&quot;ri-topic&quot; aria-label=&quot;研究方向&quot; placeholder=&quot;用自己的话说就好。你关心什么现象，觉得哪里还不够好？&quot;&gt;${h(state.topic)}&lt;/textarea&gt;&lt;div class=&quot;ri-row ri-between&quot;&gt;${btn(&#x27;topic-file&#x27;,icon(&#x27;paperclip&#x27;)+&#x27; 导入文字&#x27;)}${btn(&#x27;start&#x27;,&#x27;开始调研 &#x27;+icon(&#x27;arrow-right&#x27;),true)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ri-presets&quot;&gt;${[&#x27;长期个人助理&#x27;,&#x27;多智能体协作&#x27;,&#x27;有限数据的利用&#x27;].map(x=&gt;`&lt;button class=&quot;cursor-interaction&quot; data-example=&quot;${x}&quot;&gt;${x} ${icon(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;ri-row ri-between&quot;&gt;&lt;span class=&quot;ri-small ri-muted&quot;&gt;${h(state.model)} · ${h(state.effort)} · 近期会议与 arXiv&lt;/span&gt;&lt;button class=&quot;ri-textbutton cursor-interaction&quot; data-action=&quot;settings&quot;&gt;调整设置&lt;/button&gt;&lt;/div&gt;&lt;details style=&quot;margin-top:18px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;补充论文、资源条件，或先保存草稿&lt;/summary&gt;&lt;div class=&quot;ri-stack&quot;&gt;${btn(&#x27;import-papers&#x27;,icon(&#x27;files&#x27;)+&#x27; 添加参考论文&#x27;)}&lt;label class=&quot;ri-field&quot;&gt;&lt;span&gt;资源与范围（选填）&lt;/span&gt;&lt;textarea name=&quot;constraints&quot; placeholder=&quot;例如：关注 LLM / NLP，有一张 24GB GPU…&quot;&gt;${h(state.fields.constraints||&#x27;&#x27;)}&lt;/textarea&gt;&lt;/label&gt;${btn(&#x27;save-draft&#x27;,&#x27;先保存，暂不运行&#x27;)}&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;ri-note&quot;&gt;&lt;strong&gt;最后得到什么？&lt;/strong&gt;&lt;p&gt;背景 → 现有方法 → 重要问题 → 动机 → 研究主张。&lt;br&gt;调研和比较后会停下来，留出讨论、追问与纠正的空间。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`;}
  function discussion(){if(state.phase===&#x27;new&#x27;)return welcome();if([&#x27;running&#x27;,&#x27;error&#x27;,&#x27;stopped&#x27;].includes(state.phase))return running();return `${steps()}&lt;div class=&quot;ri-intro&quot;&gt;&lt;div&gt;&lt;div class=&quot;ri-eyebrow&quot;&gt;${state.phase===&#x27;direction&#x27;?&#x27;Explore together&#x27;:&#x27;Think it through&#x27;}&lt;/div&gt;&lt;h3&gt;${state.phase===&#x27;done&#x27;?&#x27;继续打磨这个研究问题&#x27;:state.phase===&#x27;direction&#x27;?&#x27;先确定值得深入的方向&#x27;:&#x27;这两个问题，哪个更值得追问？&#x27;}&lt;/h3&gt;&lt;p&gt;你可以质疑原因、补充观察，或让助手继续查文献。&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;ri-pill&quot;&gt;${icon(&#x27;message-circle&#x27;)} ${state.phase===&#x27;done&#x27;?&#x27;可继续讨论&#x27;:&#x27;等你讨论&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ri-background&quot;&gt;&lt;div class=&quot;ri-tiny ri-muted&quot;&gt;背景与现有方法&lt;/div&gt;&lt;p&gt;我们希望个人助理越用越省心。已有方法能记住历史、学习偏好，也能主动询问；但日常交流如何持续帮助它理解用户，还值得深入。&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;展开已有进展与论文依据&lt;/summary&gt;&lt;p&gt;记忆检索帮助复用历史；偏好学习从修改中提取规律；主动澄清补充缺少的信息。我们从这些方法有效之后的状态出发比较问题。&lt;/p&gt;&lt;button class=&quot;ri-textbutton cursor-interaction&quot; data-paper=&quot;0&quot;&gt;PRELUDE / CIPHER ↗&lt;/button&gt; · &lt;button class=&quot;ri-textbutton cursor-interaction&quot; data-paper=&quot;1&quot;&gt;Context Steering ↗&lt;/button&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;ri-row ri-between&quot;&gt;&lt;span class=&quot;ri-small&quot;&gt;当前的两个研究问题&lt;/span&gt;&lt;button class=&quot;ri-textbutton ri-tiny cursor-interaction&quot; data-action=&quot;replan&quot;&gt;用现有材料重新构思&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;ri-candidates&quot;&gt;&lt;article class=&quot;ri-candidate suggested&quot;&gt;&lt;div class=&quot;ri-row ri-between&quot;&gt;&lt;span class=&quot;ri-tiny ri-muted&quot;&gt;问题 A&lt;/span&gt;&lt;span class=&quot;ri-pill&quot;&gt;助手当前建议&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;用户少检查后，助理还能持续修正理解吗？&lt;/h4&gt;&lt;p&gt;省去的检查，可能也是发现误解、产生纠正信息的工作。这会不会改变助理后续学习的条件？&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;为什么优先它 · 和已有工作的关系&lt;/summary&gt;&lt;p&gt;它连接了“为用户省力”和“持续理解用户”这两个目标。主动询问是有力回应，仍需比较：回答这些问题是否又需要用户做回原来的检查工作。&lt;/p&gt;&lt;p&gt;减少编辑本来就是已有方法的收益，不能直接把它说成失败。&lt;/p&gt;&lt;button class=&quot;ri-textbutton cursor-interaction&quot; data-paper=&quot;0&quot;&gt;查看相关论文与原文&lt;/button&gt;&lt;/details&gt;&lt;/article&gt;&lt;article class=&quot;ri-candidate&quot;&gt;&lt;span class=&quot;ri-tiny ri-muted&quot;&gt;问题 B&lt;/span&gt;&lt;h4&gt;过去的选择，什么时候足以指导新的情境？&lt;/h4&gt;&lt;p&gt;熟悉场景里预测准确，不一定意味着已经了解条件改变后的取舍。&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;这个问题的价值 · 与 A 的区别&lt;/summary&gt;&lt;p&gt;B 关注历史信息能够支持多远；A 关注形成理解以后，纠正信息还能否持续产生。两者都有价值，当前建议先讨论后者。&lt;/p&gt;&lt;/details&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;ri-question&quot;&gt;${icon(&#x27;message-circle&#x27;)}&lt;div&gt;你观察到的“少修改”，更多是回答已经合意，还是用户没有再仔细检查？&lt;small&gt;不知道也没关系，可以让助手继续解释或补查文献。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;${state.messages.map(m=&gt;`&lt;div class=&quot;ri-message ${m.role===&#x27;user&#x27;?&#x27;user&#x27;:&#x27;&#x27;}&quot;&gt;&lt;strong&gt;${m.role===&#x27;user&#x27;?&#x27;你&#x27;:&#x27;交互演示&#x27;}&lt;/strong&gt;${h(m.text)}&lt;/div&gt;`).join(&#x27;&#x27;)}${composer()}&lt;div class=&quot;ri-next&quot;&gt;&lt;span class=&quot;ri-tiny ri-muted&quot;&gt;讨论已保留，推进后会沿用你的纠正&lt;/span&gt;${btn(&#x27;continue&#x27;,(state.phase===&#x27;direction&#x27;?&#x27;继续深入比较&#x27;:&#x27;继续整理研究主张&#x27;)+&#x27; &#x27;+icon(&#x27;arrow-right&#x27;),true)}&lt;/div&gt;&lt;details style=&quot;margin-top:22px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;查看调研过程与分析方法&lt;/summary&gt;${logs()}&lt;/details&gt;`;}
  function logs(){return `&lt;div class=&quot;ri-logline&quot;&gt;&lt;span class=&quot;ri-logtag&quot;&gt;检索&lt;/span&gt;&lt;div&gt;按不同思路检索，筛选相关论文&lt;br&gt;&lt;small&gt;初步发现 → 按相关度与时间选读&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ri-logline&quot;&gt;&lt;span class=&quot;ri-logtag&quot;&gt;阅读&lt;/span&gt;&lt;div&gt;核对 CIPHER 的偏好更新规则&lt;br&gt;&lt;button class=&quot;ri-textbutton cursor-interaction&quot; data-paper=&quot;0&quot;&gt;查看论文及 Algorithm 1&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ri-logline&quot;&gt;&lt;span class=&quot;ri-logtag&quot;&gt;分析方法&lt;/span&gt;&lt;div&gt;理解原文 · 比较已有回应 · 推导问题与动机&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ri-logline&quot;&gt;&lt;span class=&quot;ri-logtag&quot;&gt;本轮变化&lt;/span&gt;&lt;div&gt;合并相近方向，保留已有方法取得的进展&lt;br&gt;&lt;button class=&quot;ri-textbutton cursor-interaction&quot; data-action=&quot;changes&quot;&gt;查看具体修订&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;}
  function running(){const error=state.phase===&#x27;error&#x27;,stopped=state.phase===&#x27;stopped&#x27;;return `${steps()}&lt;div class=&quot;ri-running&quot;&gt;&lt;div class=&quot;ri-row&quot;&gt;${error?icon(&#x27;circle-alert&#x27;):stopped?icon(&#x27;pause&#x27;):&#x27;&lt;span class=&quot;ri-spinner&quot; aria-label=&quot;正在运行&quot;&gt;&lt;/span&gt;&#x27;}&lt;span class=&quot;ri-small ri-muted&quot;&gt;${error?&#x27;模型连接暂时中断&#x27;:stopped?&#x27;已停止，进度已保存&#x27;:&#x27;正在深入比较&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;${error?&#x27;这一步暂时没有完成&#x27;:stopped?&#x27;随时可以从这里继续&#x27;:&#x27;正在核对最接近工作的细节&#x27;}&lt;/h3&gt;&lt;p class=&quot;ri-small ri-muted&quot;&gt;${error?&#x27;网络连接失败 · 第 1 / 10 次重试 · 30 秒后自动重试&#x27;:stopped?&#x27;已经完成的阅读和讨论会继续使用。&#x27;:&#x27;当前阅读：PRELUDE / CIPHER · Algorithm 1 与相邻解释&#x27;}&lt;/p&gt;&lt;/div&gt;${error?`&lt;div class=&quot;ri-note warning&quot;&gt;已保存之前的研究进度。可以立即重试，也可以检查模型连接。&lt;div class=&quot;ri-row&quot; style=&quot;margin-top:12px&quot;&gt;${btn(&#x27;retry&#x27;,&#x27;立即重试&#x27;,true)}${btn(&#x27;model&#x27;,&#x27;检查连接&#x27;)}${btn(&#x27;stop&#x27;,&#x27;停止任务&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;details style=&quot;margin-top:18px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;错误详情与其他情况&lt;/summary&gt;&lt;p class=&quot;ri-small&quot;&gt;网络、API、模型不可用或额度不足会显示具体原因。最多每 30 秒重试一次，共 10 次；仍失败则停下并保留进度。预算用完时可调整预算后继续。&lt;/p&gt;&lt;/details&gt;`:stopped?btn(&#x27;resume&#x27;,&#x27;恢复研究 &#x27;+icon(&#x27;play&#x27;),true):`&lt;div class=&quot;ri-note&quot;&gt;正在运行，输入区暂时收起。完成当前阶段后会自动停下来与你讨论。&lt;/div&gt;&lt;div style=&quot;margin-top:17px&quot;&gt;${btn(&#x27;stop&#x27;,icon(&#x27;square&#x27;)+&#x27; 停止并保留进度&#x27;)}&lt;/div&gt;`}&lt;h4 class=&quot;ri-small&quot; style=&quot;margin-top:30px&quot;&gt;已经完成的工作&lt;/h4&gt;${logs()}&lt;details style=&quot;margin-top:20px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;详细运行记录&lt;/summary&gt;&lt;p class=&quot;ri-tiny ri-muted&quot;&gt;阶段：逐个深入 · 已保存的阅读可恢复 · 记录包含任务摘要、引用校验和重试情况。&lt;/p&gt;&lt;/details&gt;`;}
  function literature(){if(state.paper!==null)return paperDetail();const query=state.search.toLowerCase();let list=papers.map((p,i)=&gt;({...p,i})).filter(p=&gt;`${p.title} ${p.short} ${p.kind}`.toLowerCase().includes(query));if(state.sort===&#x27;recent&#x27;)list.sort((a,b)=&gt;b.year-a.year);return `&lt;div class=&quot;ri-intro&quot;&gt;&lt;div&gt;&lt;h3&gt;文献与依据&lt;/h3&gt;&lt;p&gt;先看为什么读这篇，再按需打开全文和原文位置。&lt;/p&gt;&lt;/div&gt;${btn(&#x27;import-papers&#x27;,icon(&#x27;plus&#x27;)+&#x27; 导入论文&#x27;)}&lt;/div&gt;&lt;div class=&quot;ri-row&quot;&gt;&lt;input class=&quot;ri-input&quot; id=&quot;ri-paper-search&quot; style=&quot;flex:1;width:auto&quot; value=&quot;${h(state.search)}&quot; placeholder=&quot;搜索已有论文&quot; aria-label=&quot;搜索已有论文&quot;&gt;&lt;select class=&quot;ri-input&quot; id=&quot;ri-paper-sort&quot; style=&quot;width:auto&quot; aria-label=&quot;论文排序&quot;&gt;&lt;option value=&quot;relevance&quot; ${state.sort===&#x27;relevance&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;按相关度&lt;/option&gt;&lt;option value=&quot;recent&quot; ${state.sort===&#x27;recent&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;按时间&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;details style=&quot;margin-top:15px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;手动补查文献&lt;/summary&gt;&lt;div class=&quot;ri-row&quot;&gt;&lt;input class=&quot;ri-input&quot; id=&quot;ri-manual-query&quot; style=&quot;flex:1;width:auto&quot; placeholder=&quot;输入标题或检索词&quot; aria-label=&quot;补查论文标题或检索词&quot;&gt;${btn(&#x27;manual-search&#x27;,&#x27;检索&#x27;)}&lt;/div&gt;${check(&#x27;manual_fulltext&#x27;,&#x27;同时尝试获取正文&#x27;)}&lt;/details&gt;&lt;div class=&quot;ri-row ri-between&quot; style=&quot;margin-top:19px&quot;&gt;&lt;span class=&quot;ri-tiny ri-muted&quot;&gt;${list.length} 条记录 · 正文、摘要与检索计划分别标记&lt;/span&gt;&lt;button class=&quot;ri-textbutton ri-tiny cursor-interaction&quot; data-action=&quot;search-settings&quot;&gt;调整范围与会议&lt;/button&gt;&lt;/div&gt;${list.length?list.map(p=&gt;`&lt;article class=&quot;ri-paper&quot;&gt;&lt;div class=&quot;ri-row&quot;&gt;&lt;span class=&quot;ri-pill&quot;&gt;${h(p.status)}&lt;/span&gt;&lt;span&gt;${h(p.venue)}&lt;/span&gt;&lt;span&gt;${h(p.kind)}&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;${h(p.title)}&lt;/h4&gt;&lt;p&gt;${h(p.impact)}&lt;/p&gt;&lt;div class=&quot;ri-row&quot;&gt;&lt;button class=&quot;ri-textbutton cursor-interaction&quot; data-paper=&quot;${p.i}&quot;&gt;阅读要点与依据 ${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;${p.url?`&lt;a href=&quot;${p.url}&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;论文链接 ↗&lt;/a&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;/article&gt;`).join(&#x27;&#x27;):&#x27;&lt;div class=&quot;ri-empty&quot;&gt;没有匹配的记录，可以换个关键词或手动补查。&lt;/div&gt;&#x27;}${state.files.length?`&lt;div class=&quot;ri-note&quot; style=&quot;margin-top:18px&quot;&gt;已选择的文件（预览）：${state.files.map(h).join(&#x27;、&#x27;)}&lt;br&gt;正式版会在导入后提取正文并显示读取状态。&lt;/div&gt;`:&#x27;&#x27;}`;}
  function paperDetail(){const p=papers[state.paper];return `&lt;button class=&quot;ri-button ri-quiet cursor-interaction&quot; data-action=&quot;paper-back&quot;&gt;${icon(&#x27;arrow-left&#x27;)} 返回文献&lt;/button&gt;&lt;div class=&quot;ri-stack&quot; style=&quot;margin-top:18px&quot;&gt;&lt;span class=&quot;ri-pill&quot;&gt;${h(p.status)} · ${h(p.venue)}&lt;/span&gt;&lt;h3 class=&quot;ri-section-title&quot;&gt;${h(p.title)}&lt;/h3&gt;${p.url?`&lt;div class=&quot;ri-row&quot;&gt;&lt;a href=&quot;${p.url}&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;打开论文 ↗&lt;/a&gt;&lt;a href=&quot;${p.url.replace(&#x27;/abs/&#x27;,&#x27;/pdf/&#x27;)}&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;打开全文 ↗&lt;/a&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;ri-note&quot;&gt;&lt;strong&gt;对当前问题有什么影响？&lt;/strong&gt;&lt;p&gt;${h(p.impact)}&lt;/p&gt;&lt;/div&gt;${state.paper===0?`&lt;section&gt;&lt;h4 class=&quot;ri-small&quot;&gt;方法实际上怎样做？&lt;/h4&gt;&lt;p class=&quot;ri-small&quot; style=&quot;margin-top:8px&quot;&gt;从用户的修改中归纳偏好，按当前情境检索过去的偏好。编辑量很小时沿用当前估计；编辑量较大时重新解释修改，再写入历史。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h4 class=&quot;ri-small&quot;&gt;原文依据&lt;/h4&gt;&lt;div class=&quot;ri-quote&quot;&gt;&lt;span class=&quot;ri-pill&quot;&gt;作者的方法描述&lt;/span&gt;&lt;p style=&quot;margin-top:9px&quot;&gt;“if cₜ ≤ δ then”&lt;/p&gt;&lt;small class=&quot;ri-muted&quot;&gt;Algorithm 1 · 阈值分支&lt;/small&gt;&lt;/div&gt;&lt;p class=&quot;ri-small&quot;&gt;这条规则说明了更新怎样发生；“用户有没有认真检查”仍是需要另行讨论的信息。&lt;/p&gt;&lt;/section&gt;`:`&lt;section&gt;&lt;h4 class=&quot;ri-small&quot;&gt;阅读重点&lt;/h4&gt;&lt;p class=&quot;ri-small&quot; style=&quot;margin-top:8px&quot;&gt;比较它实际可用的信息、产生的效果，以及与当前研究问题的关系。&lt;/p&gt;&lt;/section&gt;`}&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;展开完整论文分析&lt;/summary&gt;&lt;div class=&quot;ri-small&quot;&gt;研究问题 · 研究动机 · 核心洞见 · 具体方法 · 已有工作差异 · 实验设计 · 结果与解释 · 结论边界 · 研究启发&lt;/div&gt;&lt;/details&gt;${btn(&#x27;ask-paper&#x27;,&#x27;围绕这篇论文继续讨论&#x27;)}&lt;/div&gt;`;}
  const reportSections=[[&#x27;背景&#x27;,&#x27;长期个人助理需要利用过去交流减少重复说明，同时理解用户在不同时间与情境下的选择。它越好用，用户就越可能把检查和判断也交给它。&#x27;],[&#x27;现有方法&#x27;,&#x27;记忆检索、偏好学习和主动澄清已经帮助系统利用历史、吸收纠正。CIPHER 从用户修改中学习偏好，减少后续编辑，说明这条路线已有实际进展。&#x27;],[&#x27;问题&#x27;,&#x27;用户少修改，可能是回答更合意，也可能是用户少检查了。被省去的检查，恰好可能是发现误解、产生纠正信息的工作。已有反馈利用机制正常发挥之后，这部分信息仍可能没有产生。&#x27;],[&#x27;动机&#x27;,&#x27;如果维持准确理解始终要求用户重新审阅，助理实际省下的工作就值得重新理解。我们希望弄清，哪些正常互动能持续提供纠正，哪些仍依赖用户已经委托出去的检查。&#x27;],[&#x27;研究主张&#x27;,&#x27;研究长期个性化带来的检查减少，如何影响纠正信息的产生，以及助理后续修正和复用用户理解的能力。&#x27;]];
  function report(){if(state.phase!==&#x27;done&#x27;)return `&lt;div class=&quot;ri-empty&quot;&gt;${icon(&#x27;file-text&#x27;)}&lt;h3 style=&quot;margin-top:12px&quot;&gt;研究主张会从讨论中形成&lt;/h3&gt;&lt;p class=&quot;ri-small&quot;&gt;先比较问题、说清动机。讨论完成后，点击“继续整理研究主张”。&lt;/p&gt;&lt;div style=&quot;margin-top:20px&quot;&gt;${btn(&#x27;back-discuss&#x27;,&#x27;回到当前讨论&#x27;,true)}&lt;/div&gt;&lt;/div&gt;`;return `&lt;div class=&quot;ri-row ri-between&quot;&gt;&lt;span class=&quot;ri-pill&quot;&gt;研究主张 · 当前版本&lt;/span&gt;&lt;div class=&quot;ri-row&quot;&gt;${btn(&#x27;download-md&#x27;,icon(&#x27;download&#x27;)+&#x27; Markdown&#x27;)}${btn(&#x27;download-json&#x27;,&#x27;JSON&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;article class=&quot;ri-report&quot;&gt;&lt;div class=&quot;ri-eyebrow&quot; style=&quot;margin-top:27px&quot;&gt;Research question&lt;/div&gt;&lt;h3&gt;用户少检查后，助理还能持续修正对用户的理解吗？&lt;/h3&gt;${reportSections.map(([title,text],i)=&gt;`&lt;section&gt;&lt;h4&gt;${title}&lt;/h4&gt;&lt;p&gt;${text}${i===1?&#x27; &lt;button class=&quot;ri-cite cursor-interaction&quot; data-paper=&quot;0&quot;&gt;CIPHER ↗&lt;/button&gt;&#x27;:&#x27;&#x27;}&lt;/p&gt;&lt;/section&gt;`).join(&#x27;&#x27;)}&lt;/article&gt;&lt;div class=&quot;ri-next&quot;&gt;&lt;span class=&quot;ri-tiny ri-muted&quot;&gt;自动保存到 idea-时间戳 / report.md&lt;/span&gt;${btn(&#x27;revise&#x27;,&#x27;继续讨论与修订 &#x27;+icon(&#x27;message-circle&#x27;),true)}&lt;/div&gt;&lt;details style=&quot;margin-top:20px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;版本、保存位置与详细材料&lt;/summary&gt;&lt;div class=&quot;ri-stack ri-small&quot;&gt;&lt;div&gt;当前版本保留本轮纠正；历史讨论和原文依据随项目保存。&lt;/div&gt;${btn(&#x27;changes&#x27;,&#x27;查看修订记录&#x27;)}${btn(&#x27;output&#x27;,&#x27;更改保存目录&#x27;)}${btn(&#x27;export&#x27;,&#x27;重新导出已有报告&#x27;)}&lt;/div&gt;&lt;/details&gt;`;}
  function memory(){return `&lt;div class=&quot;ri-intro&quot;&gt;&lt;div&gt;&lt;h3&gt;要点与历史&lt;/h3&gt;&lt;p&gt;知道它记住了什么，也能找到你当时怎么说。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ri-subtabs&quot;&gt;${[[&#x27;notes&#x27;,&#x27;现行要点&#x27;],[&#x27;changes&#x27;,&#x27;本轮修改&#x27;],[&#x27;history&#x27;,&#x27;完整对话&#x27;]].map(([v,l])=&gt;`&lt;button class=&quot;ri-subtab cursor-interaction&quot; data-memory=&quot;${v}&quot; aria-current=&quot;${state.memory===v?&#x27;page&#x27;:&#x27;false&#x27;}&quot;&gt;${l}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${state.memory===&#x27;notes&#x27;?notes.map((x,i)=&gt;`&lt;div class=&quot;ri-memoryitem&quot;&gt;&lt;div class=&quot;ri-row ri-between&quot;&gt;&lt;span class=&quot;ri-pill&quot;&gt;持续研究要求&lt;/span&gt;&lt;button class=&quot;ri-textbutton ri-tiny cursor-interaction&quot; data-correct=&quot;${i}&quot;&gt;纠正这条&lt;/button&gt;&lt;/div&gt;&lt;p&gt;${h(x)}&lt;/p&gt;&lt;button class=&quot;ri-textbutton ri-tiny cursor-interaction&quot; data-action=&quot;history&quot;&gt;查看来源原话&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)+&#x27;&lt;details style=&quot;margin-top:18px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;已结束的临时要求&lt;/summary&gt;&lt;p class=&quot;ri-small&quot;&gt;“这轮先简明解释” · 仅本轮有效 · 已结束。原话仍保留，不作为之后的长期偏好。&lt;/p&gt;&lt;/details&gt;&#x27;:state.memory===&#x27;changes&#x27;?`&lt;div class=&quot;ri-stack&quot;&gt;&lt;div class=&quot;ri-note&quot;&gt;本轮修改已保存，后续研究会使用修订后的版本。&lt;/div&gt;&lt;div class=&quot;ri-memoryitem&quot;&gt;&lt;span class=&quot;ri-tiny ri-muted&quot;&gt;问题理解&lt;/span&gt;&lt;p&gt;从“记忆没有及时更新”改为“用户参与改变后，纠正信息如何产生”。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ri-memoryitem&quot;&gt;&lt;span class=&quot;ri-tiny ri-muted&quot;&gt;已有工作比较&lt;/span&gt;&lt;p&gt;保留已有情境学习和主动澄清的作用，不把编辑减少直接说成失败。&lt;/p&gt;&lt;button class=&quot;ri-textbutton cursor-interaction&quot; data-paper=&quot;0&quot;&gt;对应论文与依据&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`:`&lt;label class=&quot;ri-field&quot;&gt;&lt;span&gt;查找过去的讨论&lt;/span&gt;&lt;input id=&quot;ri-history-search&quot; placeholder=&quot;例如：记忆过时、少修改、资源限制&quot;&gt;&lt;/label&gt;&lt;div id=&quot;ri-history-items&quot;&gt;${historyRows(&#x27;&#x27;)}&lt;/div&gt;`}`;}
  function historyRows(q){return [{role:&#x27;你 · 方向讨论&#x27;,text:&#x27;不要预先认定问题一定来自记忆过时，也不要把普通情境推荐直接说成创新。&#x27;},{role:&#x27;研究助手 · 方向讨论&#x27;,text:&#x27;先保留不同解释，再比较已有方法正常发挥后还可能留下什么困难。&#x27;},{role:&#x27;你 · 问题讨论&#x27;,text:&#x27;不要把少修改直接说成问题，要比较用户是不是减少了检查。&#x27;},...state.messages.map(x=&gt;({role:x.role===&#x27;user&#x27;?&#x27;你&#x27;:&#x27;交互演示&#x27;,text:x.text}))].filter(x=&gt;x.text.includes(q)).map(x=&gt;`&lt;div class=&quot;ri-message&quot;&gt;&lt;strong&gt;${h(x.role)}&lt;/strong&gt;${h(x.text)}&lt;/div&gt;`).join(&#x27;&#x27;)||&#x27;&lt;div class=&quot;ri-empty&quot;&gt;没有匹配的对话。&lt;/div&gt;&#x27;;}
  function originalSettings(){return `&lt;div class=&quot;ri-intro&quot;&gt;&lt;div&gt;&lt;h3&gt;研究设置&lt;/h3&gt;&lt;p&gt;常用选项放在前面。设置保存到当前项目，可用于下一次研究。&lt;/p&gt;&lt;/div&gt;${btn(&#x27;back-discuss&#x27;,&#x27;返回研究&#x27;)}&lt;/div&gt;&lt;div class=&quot;ri-subtabs&quot;&gt;${[[&#x27;model&#x27;,&#x27;模型与账户&#x27;],[&#x27;search&#x27;,&#x27;文献范围&#x27;],[&#x27;budget&#x27;,&#x27;预算与保存&#x27;],[&#x27;skills&#x27;,&#x27;分析方法&#x27;],[&#x27;system&#x27;,&#x27;更多设置&#x27;]].map(([v,l])=&gt;`&lt;button class=&quot;ri-subtab cursor-interaction&quot; data-settings=&quot;${v}&quot; aria-current=&quot;${state.settings===v?&#x27;page&#x27;:&#x27;false&#x27;}&quot;&gt;${l}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;form id=&quot;ri-settings-form&quot;&gt;${settingsBody()}&lt;div class=&quot;ri-settings-end&quot;&gt;&lt;span class=&quot;ri-tiny ri-muted&quot;&gt;运行中的任务使用启动时的设置&lt;/span&gt;&lt;button class=&quot;ri-button ri-primary cursor-interaction&quot; type=&quot;button&quot; data-action=&quot;save-settings&quot;&gt;保存设置&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;`;}
  function advancedSettingsBody(){if(state.settings===&#x27;model&#x27;)return `&lt;div class=&quot;ri-formgrid&quot;&gt;${select(&#x27;backend&#x27;,&#x27;模型连接方式&#x27;,[[&#x27;codex&#x27;,&#x27;本地 Codex CLI&#x27;],[&#x27;claude&#x27;,&#x27;本地 Claude Code&#x27;],[&#x27;openai&#x27;,&#x27;OpenAI-compatible API&#x27;],[&#x27;anthropic&#x27;,&#x27;Anthropic API&#x27;]],state.backend,&#x27;已有本地登录可以直接沿用。&#x27;)}${modelSelect()}&lt;/div&gt;${[&#x27;codex&#x27;,&#x27;claude&#x27;].includes(state.backend)?`&lt;div class=&quot;ri-account&quot;&gt;${icon(&#x27;circle-user-round&#x27;)}&lt;div&gt;&lt;strong&gt;${state.backend===&#x27;codex&#x27;?&#x27;Codex&#x27;:&#x27;Claude Code&#x27;} 本地登录&lt;/strong&gt;&lt;small&gt;示例状态：已登录 · 使用本机认证&lt;/small&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ri-button cursor-interaction&quot; style=&quot;margin-left:auto&quot; data-action=&quot;check-account&quot;&gt;检查连接&lt;/button&gt;&lt;/div&gt;`:`&lt;div class=&quot;ri-formgrid&quot; style=&quot;margin-top:18px&quot;&gt;${field(&#x27;base_url&#x27;,&#x27;API 地址&#x27;,state.backend===&#x27;anthropic&#x27;?&#x27;https://api.anthropic.com/v1&#x27;:&#x27;https://api.openai.com/v1&#x27;)}${field(&#x27;api_key_env&#x27;,&#x27;密钥环境变量名&#x27;,state.backend===&#x27;anthropic&#x27;?&#x27;ANTHROPIC_API_KEY&#x27;:&#x27;OPENAI_API_KEY&#x27;,&#x27;text&#x27;,&#x27;读取本机环境变量；此处不显示密钥内容。&#x27;)}&lt;/div&gt;`}&lt;div style=&quot;margin-top:18px&quot;&gt;${state.backend===&#x27;codex&#x27;?select(&#x27;effort&#x27;,&#x27;思考强度&#x27;,[[&#x27;inherit&#x27;,&#x27;沿用 Codex 配置&#x27;],[&#x27;none&#x27;,&#x27;none&#x27;],[&#x27;minimal&#x27;,&#x27;minimal&#x27;],[&#x27;low&#x27;,&#x27;low · 较快&#x27;],[&#x27;medium&#x27;,&#x27;medium · 适中&#x27;],[&#x27;high&#x27;,&#x27;high · 更充分&#x27;],[&#x27;xhigh&#x27;,&#x27;xhigh&#x27;],[&#x27;max&#x27;,&#x27;max&#x27;],[&#x27;ultra&#x27;,&#x27;ultra&#x27;]],state.effort,&#x27;可用档位以所选模型实际支持为准。&#x27;):&#x27;&lt;div class=&quot;ri-note&quot;&gt;此后端沿用自身的思考设置。&lt;/div&gt;&#x27;}&lt;/div&gt;&lt;details style=&quot;margin-top:19px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;本地模型目录与高级连接设置&lt;/summary&gt;&lt;div class=&quot;ri-stack&quot;&gt;&lt;p class=&quot;ri-small&quot;&gt;本地记录：gpt-6.1-sol。目录记录不等于账户实时可用列表。&lt;/p&gt;&lt;div class=&quot;ri-formgrid&quot;&gt;${field(&#x27;codex_profile&#x27;,&#x27;Codex 配置档（选填）&#x27;,&#x27;&#x27;)}${field(&#x27;codex_bin&#x27;,&#x27;Codex 路径&#x27;,&#x27;codex&#x27;)}${field(&#x27;max_output_tokens&#x27;,&#x27;单次最大输出 token&#x27;,8192,&#x27;number&#x27;)}${select(&#x27;api_max_tokens_field&#x27;,&#x27;API 输出长度字段&#x27;,[&#x27;max_completion_tokens&#x27;,&#x27;max_tokens&#x27;],&#x27;max_completion_tokens&#x27;)}&lt;/div&gt;${btn(&#x27;login-help&#x27;,&#x27;查看登录与 API 配置说明&#x27;)}&lt;/div&gt;&lt;/details&gt;`;

  function help(){return `&lt;div class=&quot;ri-intro&quot;&gt;&lt;div&gt;&lt;h3&gt;从一个方向，到一个值得研究的问题&lt;/h3&gt;&lt;p&gt;日常只需要输入、讨论、继续。其他选项按需打开。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;${[[&#x27;说出你的想法&#x27;,&#x27;输入研究方向，也可以添加论文、文字材料和资源条件。&#x27;],[&#x27;边调研，边讨论&#x27;,&#x27;先梳理已有方法和重要方向，再深入比较。你可以随时追问、纠正，或要求补读。&#x27;],[&#x27;整理研究主张&#x27;,&#x27;讨论到满意后继续，形成背景、现有方法、问题、动机与研究主张。之后仍能继续修订。&#x27;]].map(([t,p],i)=&gt;`&lt;div class=&quot;ri-helpstep&quot;&gt;&lt;b&gt;${i+1}&lt;/b&gt;&lt;div&gt;&lt;strong class=&quot;ri-small&quot;&gt;${t}&lt;/strong&gt;&lt;p&gt;${p}&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;ri-row&quot; style=&quot;margin:24px 0&quot;&gt;${btn(&#x27;new&#x27;,&#x27;开始一个研究&#x27;,true)}${btn(&#x27;demo&#x27;,&#x27;看看演示&#x27;)}&lt;/div&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;所有功能在哪里？&lt;/summary&gt;&lt;div class=&quot;ri-helpmap&quot;&gt;&lt;span&gt;项目侧栏&lt;/span&gt;&lt;span&gt;新建、先保存、打开项目、切换历史研究。&lt;/span&gt;&lt;span&gt;讨论&lt;/span&gt;&lt;span&gt;修改主题、上传文字、反复追问、查看问题、重新构思、继续下一步。&lt;/span&gt;&lt;span&gt;运行状态&lt;/span&gt;&lt;span&gt;当前阶段、用量、停止与恢复、错误原因、自动重试和手动重试。&lt;/span&gt;&lt;span&gt;文献&lt;/span&gt;&lt;span&gt;导入 PDF / TXT / Markdown / JSON，手动检索、排序、正文、论文卡、原文证据与链接。&lt;/span&gt;&lt;span&gt;研究主张&lt;/span&gt;&lt;span&gt;当前报告、继续修订、版本记录、重新导出 Markdown / JSON、保存位置。&lt;/span&gt;&lt;span&gt;要点与历史&lt;/span&gt;&lt;span&gt;当前要求、原话出处、临时要求、实际修改、历史对话搜索。&lt;/span&gt;&lt;span&gt;模型与账户&lt;/span&gt;&lt;span&gt;Codex、Claude Code、两类 API，本地登录信息、模型目录、思考强度、配置档。&lt;/span&gt;&lt;span&gt;文献设置&lt;/span&gt;&lt;span&gt;渠道、CS 分类、动态或固定时间、会议及届次、召回与正文读取。&lt;/span&gt;&lt;span&gt;预算与保存&lt;/span&gt;&lt;span&gt;调用、时间、选读数量、问题数量、超时、资源约束、输出与项目目录。&lt;/span&gt;&lt;span&gt;分析方法&lt;/span&gt;&lt;span&gt;内置 skill、本地 skill 的查看、选择、额外查找路径与清除。&lt;/span&gt;&lt;span&gt;更多设置&lt;/span&gt;&lt;span&gt;详细输出、自动或讨论模式、环境检查、全部配置、离线演示、关闭服务。&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;ri-note&quot; style=&quot;margin-top:22px&quot;&gt;Web 与 CLI 计划共用同一研究引擎和项目记录。你不需要在网页里记住命令。&lt;/div&gt;`;}
  function render(){root.querySelector(&#x27;#ri-phase-preview&#x27;).value=state.phase;root.querySelector(&#x27;#ri-projects&#x27;).innerHTML=projects.map((x,i)=&gt;`&lt;button class=&quot;ri-project cursor-interaction&quot; data-project=&quot;${i}&quot; aria-current=&quot;${state.project===i&amp;&amp;state.phase!==&#x27;new&#x27;?&#x27;page&#x27;:&#x27;false&#x27;}&quot;&gt;&lt;strong&gt;${h(x)}&lt;/strong&gt;&lt;small&gt;${i===0?&#x27;今天 · 问题讨论&#x27;:i===1?&#x27;昨天 · 已保存&#x27;:&#x27;上周 · 已保存&#x27;}&lt;/small&gt;&lt;/button&gt;`).join(&#x27;&#x27;);root.querySelector(&#x27;#ri-project-title&#x27;).textContent=state.phase===&#x27;new&#x27;?&#x27;新的研究&#x27;:projects[state.project];root.querySelector(&#x27;#ri-breadcrumb&#x27;).textContent=state.phase===&#x27;new&#x27;?&#x27;本地工作空间&#x27;:&#x27;我的研究 / &#x27;+(state.project===0?&#x27;个人助理&#x27;:state.project===1?&#x27;文本压缩&#x27;:&#x27;自我改进&#x27;);root.querySelector(&#x27;#ri-model-label&#x27;).textContent=(state.model||&#x27;沿用模型&#x27;)+&#x27; · &#x27;+(state.backend===&#x27;codex&#x27;?state.effort:&#x27;沿用配置&#x27;);root.querySelectorAll(&#x27;[data-page]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-current&#x27;,b.dataset.page===state.page?&#x27;page&#x27;:&#x27;false&#x27;));root.querySelector(&#x27;#ri-content&#x27;).innerHTML=state.page===&#x27;discussion&#x27;?discussion():state.page===&#x27;papers&#x27;?literature():state.page===&#x27;report&#x27;?report():state.page===&#x27;memory&#x27;?memory():state.page===&#x27;settings&#x27;?settings():help();const states={new:&#x27;准备开始&#x27;,running:&#x27;运行中 · 阅读与比较&#x27;,direction:&#x27;已暂停 · 等你讨论&#x27;,problem:&#x27;已暂停 · 等你讨论&#x27;,done:&#x27;已完成 · 可以继续修订&#x27;,error:&#x27;等待重试 · 进度已保存&#x27;,stopped:&#x27;已停止 · 可以恢复&#x27;};root.querySelector(&#x27;#ri-status&#x27;).innerHTML=&#x27;&lt;span class=&quot;ri-dot&quot;&gt;&lt;/span&gt;&#x27;+states[state.phase];root.querySelector(&#x27;#ri-budget&#x27;).textContent=`模型调用 ${state.phase===&#x27;new&#x27;?0:26} / ${state.calls} · 用时 ${state.phase===&#x27;new&#x27;?0:57} / ${state.minutes} 分钟`;if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}

  function modelSelect(){return select(&#x27;model&#x27;,&#x27;模型&#x27;,state.backend===&#x27;codex&#x27;?[[&#x27;gpt-6.1-sol&#x27;,&#x27;gpt-6.1-sol&#x27;],[&#x27;&#x27;,&#x27;使用后端默认模型&#x27;]]:[[&#x27;&#x27;,&#x27;使用后端默认模型&#x27;]],state.model,&#x27;自动获取 · 当前为示例列表&#x27;);}

  function discussion(){if(state.phase===&#x27;new&#x27;)return welcome();if([&#x27;running&#x27;,&#x27;error&#x27;,&#x27;stopped&#x27;].includes(state.phase))return running();return `&lt;div class=&quot;ri-conversation&quot;&gt;&lt;div class=&quot;ri-speaker&quot;&gt;${icon(&#x27;sparkles&#x27;)} Research-idea &lt;span&gt;等你讨论&lt;/span&gt;&lt;/div&gt;&lt;p&gt;我梳理了记忆检索、偏好学习和主动询问这几类方法。它们都在帮助助理更懂用户，但接下来有两个值得深挖的问题。&lt;/p&gt;&lt;h4&gt;1. 用户少检查后，助理还能持续修正理解吗？&lt;/h4&gt;&lt;p&gt;助理越省心，用户可能越少检查它。但检查恰恰也是发现误解、提供纠正的过程。如果这部分交流减少了，助理之后靠什么继续了解用户？&lt;/p&gt;&lt;h4&gt;2. 过去的选择，能不能用于新的情境？&lt;/h4&gt;&lt;p&gt;一个人在熟悉场景里的选择，不一定能说明条件变化后他会怎么选。已有偏好在什么时候还适用，需要怎样判断？&lt;/p&gt;&lt;p&gt;&lt;strong&gt;我建议先讨论第一个。&lt;/strong&gt;它直接关系到“越用越省心”能否持续。主动询问可能有帮助，但如果回答问题仍要求用户重新检查，是否又把工作交还给了用户？&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;看看论文依据与比较过程&lt;/summary&gt;${logs()}${btn(&#x27;replan&#x27;,&#x27;重新比较其他问题&#x27;)}&lt;/details&gt;&lt;/div&gt;${state.messages.map(m=&gt;`&lt;div class=&quot;ri-message ${m.role===&#x27;user&#x27;?&#x27;user&#x27;:&#x27;&#x27;}&quot;&gt;&lt;strong&gt;${m.role===&#x27;user&#x27;?&#x27;你&#x27;:&#x27;交互演示&#x27;}&lt;/strong&gt;${h(m.text)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;ri-next&quot;&gt;&lt;span class=&quot;ri-small ri-muted&quot;&gt;你可以继续聊，也可以推进下一步。&lt;/span&gt;${btn(&#x27;continue&#x27;,&#x27;继续 &#x27;+icon(&#x27;arrow-right&#x27;))}&lt;/div&gt;${composer()}`;}

    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
